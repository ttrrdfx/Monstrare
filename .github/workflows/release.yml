name: Release bundle

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
      asset: ${{ steps.package.outputs.asset }}
      digest: ${{ steps.package.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Validate tag and source version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { parseSemVer } from './scripts/lib/manifest.mjs';

          const tag = process.env.RELEASE_TAG;
          if (process.env.GITHUB_REF !== `refs/tags/${tag}` || !tag?.startsWith('v')) {
            throw new Error('release must be triggered by a version tag');
          }
          const version = tag.slice(1);
          parseSemVer(version, 'release tag');
          const fileVersion = fs.readFileSync('VERSION', 'utf8').trim();
          const manifest = JSON.parse(fs.readFileSync('monstrare-package.json', 'utf8'));
          if (fileVersion !== version || manifest.version !== version) {
            throw new Error('tag, VERSION and source manifest version must match');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE
      - run: npm ci
      - run: npm run check
      - name: Build and verify exact bundle
        id: package
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          asset="monstrare-v${RELEASE_VERSION}.bundle.json"
          mkdir dist
          npm run package-release -- --created-from "$GITHUB_SHA" --output "dist/$asset"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { parseReleaseBundle } from './scripts/lib/release-bundle.mjs';

          const version = process.env.RELEASE_VERSION;
          const asset = `monstrare-v${version}.bundle.json`;
          const bytes = fs.readFileSync(`dist/${asset}`);
          const bundle = parseReleaseBundle(bytes, { expectedVersion: version });
          if (bundle.createdFrom !== process.env.GITHUB_SHA) {
            throw new Error('bundle commit does not match tagged commit');
          }
          const digest = crypto.createHash('sha256').update(bytes).digest('hex');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nasset=${asset}\ndigest=${digest}\n`);
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle
          path: dist/${{ steps.package.outputs.asset }}
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle
          path: dist
      - name: Publish or verify the current tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_ASSET: ${{ needs.build.outputs.asset }}
          RELEASE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" == "v$RELEASE_VERSION" ]]
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$RELEASE_ASSET" == "monstrare-v${RELEASE_VERSION}.bundle.json" ]]
          [[ "$RELEASE_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          asset_path="dist/$RELEASE_ASSET"
          [[ -f "$asset_path" && ! -L "$asset_path" ]]
          [[ "$(find dist -maxdepth 1 -type f | wc -l)" -eq 1 ]]
          printf '%s  %s\n' "$RELEASE_DIGEST" "$asset_path" | sha256sum --check --status

          release_file="$RUNNER_TEMP/monstrare-release.json"
          error_file="$RUNNER_TEMP/monstrare-release-error.txt"
          tag_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")
          tag_type=$(jq -r '.object.type' <<< "$tag_ref")
          tag_sha=$(jq -r '.object.sha' <<< "$tag_ref")
          if [[ "$tag_type" == tag ]]; then
            tagged_object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha")
            tag_type=$(jq -r '.object.type' <<< "$tagged_object")
            tag_sha=$(jq -r '.object.sha' <<< "$tagged_object")
          fi
          [[ "$tag_type" == commit && "$tag_sha" == "$GITHUB_SHA" ]] || { echo 'Remote tag no longer points to the built commit' >&2; exit 1; }
          release_api="repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG"
          if gh api "$release_api" > "$release_file" 2> "$error_file"; then
            jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and .draft == false and .prerelease == false' "$release_file" > /dev/null
            existing=$(jq -c --arg name "$RELEASE_ASSET" '[.assets[] | select(.name == $name)] | if length > 1 then error("duplicate release asset") elif length == 1 then .[0] else empty end' "$release_file")
            if [[ -n "$existing" ]]; then
              remote_digest=$(jq -r '.digest // empty' <<< "$existing")
              [[ "$remote_digest" == "sha256:$RELEASE_DIGEST" ]] || { echo 'Existing asset digest is missing or different; manual review required' >&2; exit 1; }
              echo 'Existing asset has identical digest; no upload needed.'
            else
              gh release upload "$RELEASE_TAG" "$asset_path" --repo "$GITHUB_REPOSITORY"
            fi
          elif grep -q 'HTTP 404' "$error_file"; then
            gh release create "$RELEASE_TAG" "$asset_path" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --notes "Monstrare $RELEASE_TAG"
          else
            cat "$error_file" >&2
            exit 1
          fi

          # GitHub may populate the asset digest after the upload response.
          for attempt in 1 2 3 4 5 6; do
            gh api "$release_api" > "$release_file"
            jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and .draft == false and .prerelease == false' "$release_file" > /dev/null
            remote_digest=$(jq -r --arg name "$RELEASE_ASSET" '[.assets[] | select(.name == $name)] | if length != 1 then error("expected exactly one release asset") else .[0].digest // empty end' "$release_file")
            if [[ "$remote_digest" == "sha256:$RELEASE_DIGEST" ]]; then
              echo "Verified $RELEASE_ASSET sha256:$RELEASE_DIGEST"
              exit 0
            fi
            if [[ -n "$remote_digest" ]]; then
              echo 'Uploaded asset digest differs from local bundle; manual review required' >&2
              exit 1
            fi
            [[ "$attempt" -eq 6 ]] || sleep 5
          done
          echo 'GitHub asset digest is still unavailable; manual review required' >&2
          exit 1
