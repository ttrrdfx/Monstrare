<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>專案管理平台</title>
<style>
  :root {
    --paper: #f5f6f8;
    --surface: #ffffff;
    --surface-sunken: #eef0f3;
    --ink: #14181f;
    --ink-dim: #5b6472;
    --ink-faint: #8890a0;
    --line: #dde1e7;
    --line-strong: #c3c9d3;
    --accent: #3446d6;
    --accent-soft: #eaeefc;
    --good: #1f9d6b;
    --good-soft: #e4f5ee;
    --warn: #c9860a;
    --warn-soft: #fbf1de;
    --crit: #d23b3b;
    --crit-soft: #fbe8e8;
    --muted: #6b7280;
    --muted-soft: #eceef1;
    --shadow-card: 0 1px 2px rgba(20, 24, 31, 0.06), 0 1px 1px rgba(20, 24, 31, 0.04);
    --shadow-card-hover: 0 6px 20px rgba(20, 24, 31, 0.12);
    --shadow-modal: 0 24px 64px rgba(20, 24, 31, 0.28);
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-ui);
    font-size: 14px;
    color: var(--ink);
    background: var(--paper);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 { text-wrap: balance; font-weight: 650; }
  button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px rgba(52, 70, 214, 0.35);
    border-radius: 6px;
  }
  .tabular { font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--font-mono); }

  /* ── Top chrome ── */
  .topbar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
  .topbar-row1 { display: flex; align-items: baseline; justify-content: space-between; padding: 18px 28px 4px; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand-name { font-size: 18px; font-weight: 650; letter-spacing: -0.01em; }
  .brand-sub { font-size: 12.5px; color: var(--ink-dim); }
  .sync-status { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; font-size: 12px; font-weight: 700; color: var(--ink-dim); white-space: nowrap; }
  .sync-status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
  .sync-status[data-state="live"]::before { background: var(--good); }
  .sync-status[data-state="error"] { color: var(--crit); }
  .sync-status[data-state="error"]::before { background: var(--crit); }

  .view-tabs { display: flex; gap: 4px; background: var(--surface-sunken); border-radius: 10px; padding: 3px; }
  .view-tabs button { border: none; background: transparent; color: var(--ink-dim); font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 8px; transition: background-color .15s ease, color .15s ease; }
  .view-tabs button:hover { color: var(--ink); }
  .view-tabs button.is-active { background: var(--ink); color: #fff; }
  .view { display: none; }
  .view.is-active { display: block; }

  /* ── pills ── */
  .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.02em; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .risk-low { background: var(--muted-soft); color: var(--muted); }
  .risk-medium { background: var(--warn-soft); color: var(--warn); }
  .risk-high { background: var(--crit-soft); color: var(--crit); }
  .agent-pill { background: var(--accent-soft); color: var(--accent); }
  .track-pill { background: var(--surface-sunken); color: var(--ink-dim); font-weight: 600; }
  .dep-pill.dep-blocked { background: var(--crit-soft); color: var(--crit); }
  .dep-pill.dep-missing { background: var(--warn-soft); color: var(--warn); }
  .dep-pill.dep-ok { background: var(--surface-sunken); color: var(--ink-dim); font-weight: 600; }
  .approval-pill { background: var(--surface); color: var(--ink-dim); border: 1px solid var(--line-strong); }
  .risk-stripe-low::before { background: var(--muted); }
  .risk-stripe-medium::before { background: var(--warn); }
  .risk-stripe-high::before { background: var(--crit); }

  /* ── card ── */
  .ticket-card {
    position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px 10px 14px; box-shadow: var(--shadow-card); cursor: grab;
    transition: box-shadow .15s ease, transform .15s ease, opacity .15s ease;
  }
  .ticket-card::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; }
  .ticket-card:hover { box-shadow: var(--shadow-card-hover); transform: translateY(-1px); }
  .ticket-card.is-dragging { opacity: 0.4; }
  .ticket-id { font-size: 10.5px; color: var(--ink-faint); font-weight: 600; letter-spacing: 0.02em; }
  .ticket-title { font-size: 13px; font-weight: 600; line-height: 1.35; margin: 3px 0 8px; }
  .ticket-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
  .ticket-meta-row { display: flex; align-items: center; justify-content: space-between; font-size: 11.5px; color: var(--ink-faint); }

  @media (prefers-reduced-motion: reduce) { .ticket-card, .modal, .modal-overlay { transition: none !important; } }

  /* ── lanes ── */
  .lanes { display: flex; gap: 1px; background: var(--line); overflow-x: auto; scroll-snap-type: x proximity; border-top: 1px solid var(--line); }
  .lane { flex: 0 0 232px; scroll-snap-align: start; background: var(--paper); min-height: calc(100vh - 156px); display: flex; flex-direction: column; }
  .lane.is-drag-over { background: var(--accent-soft); }
  .lane-head { position: sticky; top: 0; padding: 12px 12px 10px; border-bottom: 2px solid var(--line-strong); background: var(--paper); z-index: 1; }
  .lane-title-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .lane-title { font-size: 13px; font-weight: 700; }
  .lane-gauge { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--surface-sunken); color: var(--ink-dim); flex-shrink: 0; }
  .lane-gauge.is-over { background: var(--crit); color: #fff; }
  .lane-body { padding: 10px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .lane-empty { font-size: 11.5px; color: var(--ink-faint); padding: 10px 2px; }
  .lane-add-btn { border: 1px dashed var(--line-strong); background: transparent; color: var(--ink-faint); border-radius: 10px; padding: 8px; font-size: 12px; font-weight: 600; text-align: center; }
  .lane-add-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .lane-add-form { display: flex; flex-direction: column; gap: 6px; }
  .lane-add-form input { border: 1px solid var(--line-strong); border-radius: 8px; padding: 7px 9px; font-size: 12.5px; }
  .lane-add-form .row { display: flex; gap: 6px; }
  .lane-add-form button { border: none; border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 700; }
  .lane-add-form .save { background: var(--ink); color: #fff; flex: 1; }
  .lane-add-form .cancel { background: var(--surface-sunken); color: var(--ink-dim); }

  /* ── modal ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(20, 24, 31, 0.45); display: flex; align-items: flex-start; justify-content: center; padding: 5vh 20px; overflow-y: auto; z-index: 100; opacity: 0; transition: opacity .15s ease; }
  .modal-overlay.is-open { opacity: 1; }
  .modal-overlay[hidden] { display: none; }
  .modal { background: var(--surface); border-radius: 16px; width: 100%; max-width: 640px; box-shadow: var(--shadow-modal); transform: translateY(8px) scale(0.98); transition: transform .15s ease; }
  .modal-overlay.is-open .modal { transform: translateY(0) scale(1); }
  .modal-head { display: flex; align-items: flex-start; justify-content: space-between; padding: 20px 24px 0; gap: 12px; }
  .modal-id { font-size: 11.5px; color: var(--ink-faint); font-weight: 700; }
  .modal-title-input { font-size: 18px; font-weight: 700; margin: 4px 0 0; width: 100%; border: none; border-radius: 8px; padding: 4px 6px; margin-left: -6px; }
  .modal-title-input:hover, .modal-title-input:focus { background: var(--surface-sunken); }
  .modal-close { border: none; background: var(--surface-sunken); color: var(--ink-dim); width: 30px; height: 30px; border-radius: 8px; font-size: 15px; flex-shrink: 0; }
  .modal-close:hover { color: var(--ink); }
  .modal-meta-static { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px 20px; padding: 14px 24px 0; }
  .meta-item { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .meta-item-wide { grid-column: 1 / -1; }
  .meta-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-faint); }
  .meta-value { font-size: 13px; font-weight: 600; color: var(--ink); display: flex; align-items: center; gap: 6px; overflow-wrap: anywhere; }
  .stage-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .modal-body { padding: 18px 24px 24px; display: flex; flex-direction: column; gap: 20px; }
  .modal-section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); margin-bottom: 8px; display: block; }
  .content-input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; resize: vertical; min-height: 220px; }
  .refs-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .refs-list span { font-size: 11.5px; background: var(--surface-sunken); border-radius: 6px; padding: 3px 8px; }
  .comment { display: flex; gap: 10px; margin-bottom: 12px; }
  .comment-avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .comment-name { font-size: 12.5px; font-weight: 700; }
  .comment-time { font-size: 11px; color: var(--ink-faint); font-weight: 400; margin-left: 6px; }
  .comment-text { font-size: 13px; color: var(--ink-dim); margin-top: 2px; line-height: 1.5; white-space: pre-wrap; }
  .no-comment { font-size: 13px; color: var(--ink-faint); margin-bottom: 10px; }
  .comment-form { display: flex; gap: 8px; align-items: flex-start; }
  .comment-form textarea { flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; min-height: 40px; resize: vertical; }
  .comment-form button { border: none; background: var(--ink); color: #fff; border-radius: 8px; padding: 8px 14px; font-size: 12.5px; font-weight: 700; align-self: flex-start; }
  .modal-footer { display: flex; justify-content: space-between; padding: 0 24px 22px; }
  .danger-btn { border: 1px solid var(--crit-soft); background: var(--crit-soft); color: var(--crit); border-radius: 8px; padding: 7px 14px; font-size: 12.5px; font-weight: 700; }
  .danger-btn:hover { background: var(--crit); color: #fff; }

  /* ── roadmap: Variant C focused tree ── */
  .progress-bar { height: 6px; border-radius: 4px; background: var(--surface-sunken); overflow: hidden; }
  .progress-bar > span { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  .roadmap-shell { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: calc(100vh - 68px); }
  .epic-nav { background: var(--surface); border-right: 1px solid var(--line); padding: 24px 16px; }
  .epic-nav-title { font-size: 16px; margin: 0 8px 20px; }
  .epic-nav-list { display: flex; flex-direction: column; gap: 8px; }
  .epic-nav-item { border: 0; background: transparent; border-radius: 12px; padding: 16px; text-align: left; min-width: 0; }
  .epic-nav-item:hover { background: var(--surface-sunken); }
  .epic-nav-item.is-active { background: var(--accent-soft); color: var(--accent); }
  .epic-nav-name { display: block; font-size: 14px; font-weight: 700; line-height: 1.3; }
  .epic-nav-progress { display: block; font-size: 11px; color: var(--ink-dim); margin-top: 8px; }
  .roadmap-main { min-width: 0; overflow: hidden; }
  .roadmap-head { min-height: 76px; padding: 16px 28px; background: var(--surface); display: flex; align-items: center; justify-content: space-between; gap: 24px; }
  .roadmap-head h2 { font-size: 20px; line-height: 1.25; }
  .roadmap-head p { font-size: 12px; color: var(--ink-dim); line-height: 1.5; margin-top: 4px; max-width: 72ch; }
  .roadmap-mode { flex-shrink: 0; font-size: 12px; color: var(--ink-dim); font-weight: 700; }
  .roadmap-mode::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-right: 8px; }
  .roadmap-mode.is-error { color: var(--warn); }
  .roadmap-mode.is-error::before { background: var(--warn); }
  .roadmap-canvas { position: relative; min-height: calc(100vh - 144px); overflow: hidden; touch-action: none; cursor: grab; background-image: radial-gradient(var(--line-strong) .7px, transparent .7px); background-size: 24px 24px; }
  .roadmap-canvas.is-panning { cursor: grabbing; user-select: none; }
  .tree-stage { position: absolute; left: 0; top: 0; min-width: 1040px; min-height: 620px; transform-origin: 0 0; will-change: transform; }
  .tree-svg { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  .tree-edge { fill: none; stroke: var(--line-strong); stroke-width: 2; }
  .tree-node { position: absolute; z-index: 1; border: 0; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow-card); padding: 16px; text-align: left; overflow: hidden; }
  button.tree-node:hover { box-shadow: var(--shadow-card-hover); transform: translateY(-1px); }
  .tree-node-root { width: 232px; min-height: 132px; border-left: 4px solid var(--accent); padding: 20px; }
  .tree-node-story { width: 248px; min-height: 112px; border-left: 4px solid var(--good); }
  .tree-node-story.is-unclassified { border-left-color: var(--warn); }
  .tree-node-task { width: 288px; min-height: 76px; }
  .node-label { display: block; font-size: 11px; color: var(--ink-faint); font-weight: 700; line-height: 1.3; }
  .node-name { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; font-size: 16px; font-weight: 700; line-height: 1.25; margin: 4px 0 12px; }
  .tree-node-task .node-name { font-size: 13px; line-height: 1.5; margin-bottom: 0; }
  .tree-node-task.is-done .node-name { color: var(--ink-dim); text-decoration: line-through; text-decoration-color: var(--line-strong); }
  .node-status { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--ink-dim); margin-top: 8px; }
  .node-collapse { font-size: 11px; color: var(--accent); font-weight: 700; }
  .tree-toolbar { position: sticky; float: right; right: 24px; top: 24px; display: flex; z-index: 4; margin: 24px; padding: 4px; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow-card); }
  .tree-toolbar button { width: 40px; height: 40px; border: 0; border-radius: 8px; background: transparent; font-weight: 700; }
  .tree-toolbar button:hover:not(:disabled) { background: var(--surface-sunken); }
  .tree-toolbar button:focus-visible, .tree-node:focus-visible, .epic-nav-item:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .tree-toolbar button:disabled { color: var(--ink-faint); cursor: not-allowed; opacity: .55; }
  .viewport-status { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  .roadmap-state { min-height: calc(100vh - 68px); display: grid; place-items: center; padding: 48px 24px; text-align: center; }
  .roadmap-state-card { max-width: 480px; background: var(--surface); border-radius: 16px; padding: 32px; box-shadow: var(--shadow-card); }
  .roadmap-state-card h2 { font-size: 20px; margin-bottom: 8px; }
  .roadmap-state-card p { color: var(--ink-dim); line-height: 1.6; }
  .state-action { margin-top: 20px; border: 0; background: var(--ink); color: var(--surface); font-size: 13px; font-weight: 700; padding: 12px 16px; border-radius: 8px; }
  .skeleton { background: linear-gradient(90deg, var(--surface-sunken), var(--surface), var(--surface-sunken)); background-size: 200% 100%; animation: skeleton 1.2s infinite; }
  @keyframes skeleton { to { background-position: -200% 0; } }
  .roadmap-skeleton { display: grid; grid-template-columns: 232px 248px 288px; gap: 104px; align-items: center; min-height: 620px; padding: 64px; }
  .roadmap-skeleton span { display: block; height: 112px; border-radius: 12px; }

  @media (max-width: 640px) {
    .topbar-row1 { padding: 12px 16px 8px; }
    .brand-sub { display: none; }
    .roadmap-shell { display: block; }
    .epic-nav { border-right: 0; border-bottom: 1px solid var(--line); padding: 12px 16px; overflow-x: auto; }
    .epic-nav-title { display: none; }
    .epic-nav-list { flex-direction: row; width: max-content; }
    .epic-nav-item { min-width: 180px; min-height: 72px; padding: 12px 16px; }
    .roadmap-head { padding: 12px 16px; align-items: flex-start; }
    .roadmap-head h2 { font-size: 18px; }
    .roadmap-mode { font-size: 11px; padding-top: 4px; }
    .roadmap-canvas { min-height: 600px; }
    .tree-stage { min-width: 920px; }
    .tree-toolbar { right: 16px; top: 16px; margin: 16px; }
    .tree-toolbar button { width: 44px; height: 44px; }
  }

  @media (prefers-reduced-motion: no-preference) { .tree-stage { transition: transform 160ms ease; } .roadmap-canvas.is-panning .tree-stage { transition: none; } }
  @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }

  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(12px); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; z-index: 200; }
  #toast.is-shown { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.is-error { background: var(--crit); }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row1">
    <div class="brand">
      <span class="brand-name">專案管理平台</span>
      <span class="brand-sub">ai/process/kanban.md 的視覺化 — Variant A · 控制塔</span>
    </div>
    <span class="sync-status" id="sync-status" data-state="connecting" role="status" aria-live="polite">正在連線</span>
    <div class="view-tabs" role="tablist">
      <button type="button" class="is-active" data-view="board" role="tab">看板</button>
      <button type="button" data-view="roadmap" role="tab">藍圖</button>
    </div>
  </div>
</div>

<main>
  <section id="view-board" class="view is-active">
    <div class="lanes" id="lanes"></div>
  </section>
  <section id="view-roadmap" class="view">
    <div id="roadmap" aria-live="polite"></div>
  </section>
</main>

<div class="modal-overlay" id="modal-overlay" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>
<div id="toast"></div>

<script type="module">
/* roadmap-data:start */
const UNCLASSIFIED_STORY_NAME = "（未分類任務）";

function percentage(done, total) {
  return total ? Math.round((done / total) * 100) : 0;
}

function progressFor(tasks) {
  const list = Array.isArray(tasks) ? tasks : [];
  const done = list.filter((task) => task && task.stage === "done").length;
  return { done, total: list.length, percent: percentage(done, list.length) };
}

function compareTasks(a, b) {
  const aOrder = Number.isFinite(a && a.order) ? a.order : Number.MAX_SAFE_INTEGER;
  const bOrder = Number.isFinite(b && b.order) ? b.order : Number.MAX_SAFE_INTEGER;
  if (aOrder !== bOrder) return aOrder - bOrder;
  return String((a && a.id) || "").localeCompare(String((b && b.id) || ""));
}

export function createKanbanUiState() {
  return {
    selectedEpicName: null,
    collapsedBranches: new Set(),
    viewport: { scale: 1, x: 0, y: 0 },
    syncState: "connecting"
  };
}

export function clampZoom(scale) {
  return Math.min(1.6, Math.max(0.25, Number.isFinite(scale) ? scale : 1));
}

export function wheelZoomFactor(deltaY, deltaMode, pageHeight) {
  const rawDelta = Number.isFinite(deltaY) ? deltaY : 0;
  const pixelsPerUnit = deltaMode === 1
    ? 16
    : deltaMode === 2
      ? Math.max(1, Number.isFinite(pageHeight) ? pageHeight : 800)
      : 1;
  const pixelDelta = Math.max(-120, Math.min(120, rawDelta * pixelsPerUnit));
  return Math.exp(-pixelDelta * 0.001);
}

export function fitViewport(contentWidth, contentHeight, viewportWidth, viewportHeight, padding) {
  const inset = Number.isFinite(padding) ? Math.max(0, padding) : 32;
  const availableWidth = Math.max(1, viewportWidth - inset * 2);
  const availableHeight = Math.max(1, viewportHeight - inset * 2);
  const scale = clampZoom(Math.min(availableWidth / Math.max(1, contentWidth), availableHeight / Math.max(1, contentHeight)));
  return {
    scale,
    x: Math.round((viewportWidth - contentWidth * scale) / 2),
    y: Math.round((viewportHeight - contentHeight * scale) / 2)
  };
}

export function resolveSelectedEpicName(epics, selectedEpicName) {
  const list = Array.isArray(epics) ? epics : [];
  if (list.some((epic) => epic && epic.name === selectedEpicName)) return selectedEpicName;
  return list.length && list[0] ? list[0].name : null;
}

export function buildEpicProgress(epics, tickets) {
  const epicList = Array.isArray(epics) ? epics : [];
  const ticketList = Array.isArray(tickets) ? tickets : [];
  return epicList.map((epic) => {
    const tasks = ticketList.filter((task) => task && task.epic === epic.name);
    return { name: epic.name, definition: epic.definition || "", progress: progressFor(tasks) };
  });
}

export function buildSelectedEpicTree(epics, tickets, selectedEpicName) {
  const epicList = Array.isArray(epics) ? epics : [];
  const ticketList = Array.isArray(tickets) ? tickets : [];
  const resolvedName = resolveSelectedEpicName(epicList, selectedEpicName);
  if (resolvedName === null) return null;

  const epic = epicList.find((item) => item && item.name === resolvedName);
  const epicTasks = ticketList.filter((task) => task && task.epic === resolvedName);
  const definitions = Array.isArray(epic.stories) ? epic.stories : [];
  const storyNames = new Set(definitions.map((story) => story && story.name));
  const stories = definitions.map((story) => {
    const tasks = epicTasks.filter((task) => task.userStory === story.name).sort(compareTasks);
    return {
      name: story.name,
      definition: story.definition || "",
      unclassified: false,
      progress: progressFor(tasks),
      tasks
    };
  });
  const unclassified = epicTasks.filter((task) => !storyNames.has(task.userStory)).sort(compareTasks);

  if (unclassified.length) {
    stories.push({
      name: UNCLASSIFIED_STORY_NAME,
      definition: "屬於這個 Epic，但還沒指定 User Story。",
      unclassified: true,
      progress: progressFor(unclassified),
      tasks: unclassified
    });
  }

  return {
    name: epic.name,
    definition: epic.definition || "",
    progress: progressFor(epicTasks),
    stories
  };
}

export function buildFocusedTreeLayout(tree, collapsedBranchNames) {
  if (!tree) return { width: 0, height: 0, nodes: [], edges: [] };
  const collapsed = collapsedBranchNames instanceof Set ? collapsedBranchNames : new Set();
  const epicCollapsed = collapsed.has(tree.name + "::*");
  const nodes = [];
  const edges = [];
  const left = { root: 64, story: 400, task: 752 };
  const sizes = { root: { width: 232, height: 132 }, story: { width: 248, height: 112 }, task: { width: 288, height: 76 } };
  const visibleStories = epicCollapsed ? [] : tree.stories || [];
  let cursorY = 64;

  visibleStories.forEach((story, storyIndex) => {
    const storyKey = tree.name + "::" + story.name;
    const isCollapsed = collapsed.has(storyKey);
    const visibleTasks = isCollapsed ? [] : story.tasks;
    const branchHeight = Math.max(sizes.story.height, visibleTasks.length ? visibleTasks.length * 92 - 16 : sizes.story.height);
    const storyY = cursorY + Math.max(0, (branchHeight - sizes.story.height) / 2);
    const storyId = "story-" + storyIndex;
    nodes.push({ id: storyId, type: "story", x: left.story, y: storyY, width: sizes.story.width, height: sizes.story.height, story, collapsed: isCollapsed });

    visibleTasks.forEach((task, taskIndex) => {
      const taskY = cursorY + taskIndex * 92;
      const taskId = "task-" + storyIndex + "-" + taskIndex;
      nodes.push({ id: taskId, type: "task", x: left.task, y: taskY, width: sizes.task.width, height: sizes.task.height, task });
      edges.push({ from: storyId, to: taskId });
    });
    cursorY += branchHeight + 32;
  });

  const height = Math.max(620, cursorY + 32);
  const rootY = Math.max(64, (height - sizes.root.height) / 2);
  nodes.unshift({ id: "root", type: "root", x: left.root, y: rootY, width: sizes.root.width, height: sizes.root.height, tree, collapsed: epicCollapsed });
  visibleStories.forEach((story, storyIndex) => edges.unshift({ from: "root", to: "story-" + storyIndex }));
  return { width: epicCollapsed ? 360 : 1104, height, nodes, edges };
}

export function parseChangeResources(rawData) {
  try {
    const data = JSON.parse(rawData);
    if (!data || !Array.isArray(data.resources)) return [];
    return Array.from(new Set(data.resources.filter((resource) => resource === "cards" || resource === "epics")));
  } catch (_) {
    return [];
  }
}

export function mergeChangeResources(current, incoming) {
  return Array.from(new Set([].concat(current || [], incoming || [])))
    .filter((resource) => resource === "cards" || resource === "epics");
}

export function createLatestRequestGate() {
  const sequences = new Map();
  return {
    begin(resource) {
      const sequence = (sequences.get(resource) || 0) + 1;
      sequences.set(resource, sequence);
      return sequence;
    },
    isLatest(resource, candidate) { return candidate === sequences.get(resource); }
  };
}

    openId = id;
    var tk = getTicket(id);
    if (!tk) return;
    var stage = STAGES[stageIndex(tk.stage)];

    var dependsOnText = (tk.dependsOn && tk.dependsOn.length) ? tk.dependsOn.join("、") : "無";

    var refs = tk.refs.length
      ? '<div class="refs-list">' + tk.refs.map(function (r) { return "<span class=\"mono\">" + escapeHtml(r) + "</span>"; }).join("") + "</div>"
      : '<p class="no-comment">尚無關聯檔案。</p>';

    var commentsHtml = tk.comments.length
      ? tk.comments.map(function (c) {
          var initial = c.name ? c.name.charAt(0).toUpperCase() : "?";
          return '<div class="comment"><div class="comment-avatar">' + initial + '</div><div><span class="comment-name">' + escapeHtml(c.name) +
            '</span><span class="comment-time">' + escapeHtml(c.time) + '</span><div class="comment-text">' + escapeHtml(c.text) + "</div></div></div>";
        }).join("")
      : '<p class="no-comment">尚無留言。</p>';

    document.getElementById("modal").innerHTML =
      '<div class="modal-head"><div style="flex:1;"><div class="modal-id mono">' + tk.id + '</div>' +
      '<input class="modal-title-input" id="field-title" value="' + escapeHtml(tk.title) + '"></div>' +
      '<button type="button" class="modal-close" id="modal-close-btn">✕</button></div>' +
      '<div class="modal-meta-static">' +
      '<div class="meta-item"><span class="meta-label">階段</span><span class="meta-value"><span class="stage-dot" style="background:' + stage.color + '"></span>' + stage.label + "</span></div>" +
      '<div class="meta-item"><span class="meta-label">風險</span><span class="meta-value">' + riskLabel(tk.risk) + "</span></div>" +
      '<div class="meta-item"><span class="meta-label">分軌</span><span class="meta-value">' + (tk.track && tk.track !== "n/a" ? trackLabel(tk.track) : "不適用") + "</span></div>" +
      '<div class="meta-item"><span class="meta-label">Owner</span><span class="meta-value">' + (escapeHtml(tk.owner) || "—") + "</span></div>" +
      '<div class="meta-item"><span class="meta-label">Agent</span><span class="meta-value">' + (escapeHtml(tk.agent) || "—") + "</span></div>" +
      '<div class="meta-item"><span class="meta-label">需人工核准</span><span class="meta-value">' + (tk.approvalRequired ? "是" : "否") + "</span></div>" +
      '<div class="meta-item"><span class="meta-label">Epic</span><span class="meta-value">' + (escapeHtml(tk.epic) || "（未分類）") + "</span></div>" +
      '<div class="meta-item"><span class="meta-label">User Story</span><span class="meta-value">' + (escapeHtml(tk.userStory) || "（未分類）") + "</span></div>" +
      '<div class="meta-item meta-item-wide"><span class="meta-label">前置任務（dependsOn）</span><span class="meta-value">' + escapeHtml(dependsOnText) + "</span></div>" +
      "</div>" +
      '<div class="modal-body">' +
      '<div><span class="modal-section-label">描述</span><textarea class="content-input" id="field-content" placeholder="補充說明…">' + escapeHtml(tk.content) + "</textarea></div>" +
      '<div><span class="modal-section-label">相關檔案</span>' + refs + "</div>" +
      '<div><span class="modal-section-label">留言</span>' + commentsHtml +
      '<div class="comment-form"><textarea id="new-comment" placeholder="留個言…"></textarea><button type="button" id="add-comment">送出</button></div></div>' +
      "</div>" +
      '<div class="modal-footer"><button type="button" class="danger-btn" id="delete-card">刪除卡片</button><span></span></div>';

    var overlay = document.getElementById("modal-overlay");
    overlay.hidden = false;
    modalDirtyFields.clear();
    pendingModalRefresh = false;
    requestAnimationFrame(function () { overlay.classList.add("is-open"); });
  }

  function closeModal() {
    var overlay = document.getElementById("modal-overlay");
    overlay.classList.remove("is-open");
    modalDirtyFields.clear();
    pendingModalRefresh = false;
    setTimeout(function () { overlay.hidden = true; openId = null; }, 150);
  }

  function persistField(tk, fieldId) {
    saveOne(tk).then(function (saved) {
      if (saved && saved.id) TICKETS = TICKETS.map(function (item) { return item.id === saved.id ? saved : item; });
      modalDirtyFields.delete(fieldId);
      if (pendingModalRefresh) queueResourceReload(["cards"], 0);
      else renderAll();
    }).catch(function () {
      modalDirtyFields.delete(fieldId);
      pendingModalRefresh = false;
      loadResources(["cards"]);
    });
  }

  function showToast(msg, isError) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.toggle("is-error", !!isError);
    el.classList.add("is-shown");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { el.classList.remove("is-shown"); }, 2600);
  }

  /* ── drag and drop ── */
  var dragId = null;

  function getDragAfterElement(container, y) {
    var els = Array.prototype.slice.call(container.querySelectorAll(".ticket-card:not(.is-dragging)"));
    var closest = { offset: -Infinity, element: null };
    els.forEach(function (child) {
      var box = child.getBoundingClientRect();
      var offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) closest = { offset: offset, element: child };
    });
    return closest.element;
  }

  function commitDrop() {
    var changed = [];
    document.querySelectorAll(".lane").forEach(function (lane) {
      var stageId = lane.dataset.stage;
      var ids = Array.prototype.map.call(lane.querySelectorAll(".ticket-card"), function (el) { return el.dataset.id; });
      ids.forEach(function (id, i) {
        var tk = getTicket(id);
        if (!tk) return;
        var newOrder = i + 1;
        if (tk.stage !== stageId || tk.order !== newOrder) {
          tk.stage = stageId;
          tk.order = newOrder;
          changed.push(tk);
        }
      });
    });
    if (changed.length) {
      saveBulk(changed).catch(function () { loadAll().then(renderAll); });
    }
  }

  /* ── events ── */
  document.addEventListener("dragstart", function (e) {
    var card = e.target.closest(".ticket-card");
    if (!card) return;
    dragId = card.dataset.id;
    setTimeout(function () { card.classList.add("is-dragging"); }, 0);
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", dragId);
  });

  document.addEventListener("dragend", function (e) {
    var card = e.target.closest(".ticket-card");
    if (card) card.classList.remove("is-dragging");
    document.querySelectorAll(".lane.is-drag-over").forEach(function (l) { l.classList.remove("is-drag-over"); });
  });

  document.addEventListener("dragover", function (e) {
    var lane = e.target.closest(".lane");
    if (!lane || !dragId) return;
    e.preventDefault();
    document.querySelectorAll(".lane.is-drag-over").forEach(function (l) { if (l !== lane) l.classList.remove("is-drag-over"); });
    lane.classList.add("is-drag-over");
    var laneBody = lane.querySelector(".lane-body");
    var dragging = laneBody.querySelector(".is-dragging") || document.querySelector('.ticket-card[data-id="' + dragId + '"]');
    if (!dragging) return;
    var afterEl = getDragAfterElement(laneBody, e.clientY);
    var addBtn = laneBody.querySelector(".lane-add-btn");
    if (afterEl == null) laneBody.insertBefore(dragging, addBtn);
    else laneBody.insertBefore(dragging, afterEl);
  });

  document.addEventListener("drop", function (e) {
    var lane = e.target.closest(".lane");
    if (!lane) return;
    e.preventDefault();
    lane.classList.remove("is-drag-over");
    dragId = null;
    commitDrop();
  });

  document.addEventListener("click", function (e) {
    if (e.target.closest(".ticket-card")) { openModal(e.target.closest(".ticket-card").dataset.id); return; }

    var taskRow = e.target.closest("[data-open]");
    if (taskRow) { openModal(taskRow.dataset.open); return; }

    var epicSelector = e.target.closest("[data-select-epic]");
    if (epicSelector) {
      KANBAN_UI_STATE.selectedEpicName = epicSelector.dataset.selectEpic;
      renderRoadmap();
      fitRoadmap(false);
      return;
    }

    var storyToggle = e.target.closest("[data-collapse-story]");
    if (storyToggle) {
      var storyName = storyToggle.dataset.collapseStory;
      var branchKey = KANBAN_UI_STATE.selectedEpicName + "::" + storyToggle.dataset.collapseStory;
      if (KANBAN_UI_STATE.collapsedBranches.has(branchKey)) KANBAN_UI_STATE.collapsedBranches.delete(branchKey);
      else KANBAN_UI_STATE.collapsedBranches.add(branchKey);
      renderRoadmap();
      fitRoadmap(false);
      var restoredStory = Array.from(document.querySelectorAll("[data-collapse-story]")).find(function (node) { return node.dataset.collapseStory === storyName; });
      if (restoredStory) restoredStory.focus();
      return;
    }

    var epicToggle = e.target.closest("[data-collapse-epic]");
    if (epicToggle) {
      var epicKey = KANBAN_UI_STATE.selectedEpicName + "::*";
      if (KANBAN_UI_STATE.collapsedBranches.has(epicKey)) KANBAN_UI_STATE.collapsedBranches.delete(epicKey);
      else KANBAN_UI_STATE.collapsedBranches.add(epicKey);
      renderRoadmap();
      fitRoadmap(false);
      var restoredEpic = document.querySelector("[data-collapse-epic]");
      if (restoredEpic) restoredEpic.focus();
      return;
    }

    if (e.target.closest("[data-zoom-out]")) { zoomRoadmap(KANBAN_UI_STATE.viewport.scale - 0.1, null, null, true); return; }
    if (e.target.closest("[data-zoom-in]")) { zoomRoadmap(KANBAN_UI_STATE.viewport.scale + 0.1, null, null, true); return; }
    if (e.target.closest("[data-fit-view]")) { fitRoadmap(true); return; }

    if (e.target.closest("[data-retry-roadmap]")) {
      roadmapPreviewState = null;
      roadmapStatus = "loading";
      roadmapError = null;
      renderRoadmap();
      loadAll().then(function () { roadmapStatus = "ready"; renderAll(); }).catch(function (err) { roadmapStatus = "error"; roadmapError = err; renderRoadmap(); });
      return;
    }

    var viewTab = e.target.closest(".view-tabs button");
    if (viewTab) { switchView(viewTab.dataset.view); return; }

    var addBtn = e.target.closest("[data-add-to]");
    if (addBtn) {
      var stageId = addBtn.dataset.addTo;
      var form = document.createElement("div");
      form.className = "lane-add-form";
      form.innerHTML = '<input type="text" placeholder="卡片標題…" autofocus><div class="row">' +
        '<button type="button" class="save">新增</button><button type="button" class="cancel">取消</button></div>';
      addBtn.replaceWith(form);
      var input = form.querySelector("input");
      input.focus();
      function submit() {
        var title = input.value.trim();
        if (!title) return;
        createCard({ title: title, stage: stageId }).then(function (card) {
          TICKETS.push(card);
          renderAll();
        });
      }
      form.querySelector(".save").addEventListener("click", submit);
      form.querySelector(".cancel").addEventListener("click", renderAll);
      input.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); if (e.key === "Escape") renderAll(); });
      return;
    }

    if (e.target === document.getElementById("modal-overlay")) { closeModal(); return; }
    if (e.target.id === "modal-close-btn") { closeModal(); return; }

    if (e.target.id === "add-comment" && openId) {
      var tk4 = getTicket(openId);
      var textarea = document.getElementById("new-comment");
      var text = textarea.value.trim();
      if (!text) return;
      var now = new Date();
      var pad = function (n) { return String(n).padStart(2, "0"); };
      var time = pad(now.getMonth() + 1) + "-" + pad(now.getDate()) + " " + pad(now.getHours()) + ":" + pad(now.getMinutes());
      tk4.comments.push({ name: COMMENT_AUTHOR, time: time, text: text });
      saveOne(tk4).then(function () { openModal(openId); });
      return;
    }

    if (e.target.id === "delete-card" && openId) {
      if (!window.confirm("確定要刪除 " + openId + " 嗎？此動作無法復原。")) return;
      var idToDelete = openId;
      deleteCard(idToDelete).then(function () {
        TICKETS = TICKETS.filter(function (x) { return x.id !== idToDelete; });
        closeModal();
        renderAll();
      });
      return;
    }
  });

  document.addEventListener("blur", function (e) {
    if (!openId) return;
    var tk = getTicket(openId);
    if (e.target.id === "field-title" && e.target.value.trim() && e.target.value !== tk.title) {
      tk.title = e.target.value.trim(); persistField(tk, "field-title");
    } else if (e.target.id === "field-content" && e.target.value !== tk.content) {
      tk.content = e.target.value; persistField(tk, "field-content");
    } else {
      modalDirtyFields.delete(e.target.id);
      if (pendingModalRefresh && !isModalDirty()) renderSynchronizedData();
    }
  }, true);

  document.addEventListener("input", function (e) {
    if (!openId) return;
    if (["field-title", "field-content", "new-comment"].includes(e.target.id)) modalDirtyFields.add(e.target.id);
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !document.getElementById("modal-overlay").hidden) closeModal();
    var canvas = e.target.closest && e.target.closest(".roadmap-canvas");
    if (!canvas) return;
    var nodes = Array.from(canvas.querySelectorAll(".tree-node:is(button)"));
    var nodeIndex = nodes.indexOf(e.target);
    if (nodeIndex >= 0 && ["ArrowRight", "ArrowDown", "ArrowLeft", "ArrowUp"].includes(e.key)) {
      e.preventDefault();
      var delta = e.key === "ArrowRight" || e.key === "ArrowDown" ? 1 : -1;
      nodes[(nodeIndex + delta + nodes.length) % nodes.length].focus();
      return;
    }
    if (["+", "="].includes(e.key)) { e.preventDefault(); zoomRoadmap(KANBAN_UI_STATE.viewport.scale + 0.1, null, null, true); }
    else if (e.key === "-") { e.preventDefault(); zoomRoadmap(KANBAN_UI_STATE.viewport.scale - 0.1, null, null, true); }
    else if (e.key === "0") { e.preventDefault(); fitRoadmap(true); }
    else if (["ArrowRight", "ArrowDown", "ArrowLeft", "ArrowUp"].includes(e.key)) {
      e.preventDefault();
      var amount = e.shiftKey ? 80 : 32;
      KANBAN_UI_STATE.viewport.x += e.key === "ArrowRight" ? -amount : e.key === "ArrowLeft" ? amount : 0;
      KANBAN_UI_STATE.viewport.y += e.key === "ArrowDown" ? -amount : e.key === "ArrowUp" ? amount : 0;
      applyViewport(false);
    }
  });

  document.addEventListener("wheel", function (e) {
    var canvas = e.target.closest && e.target.closest(".roadmap-canvas");
    if (!canvas) return;
    e.preventDefault();
    var factor = wheelZoomFactor(e.deltaY, e.deltaMode, canvas.clientHeight);
    zoomRoadmap(KANBAN_UI_STATE.viewport.scale * factor, e.clientX, e.clientY, false);
  }, { passive: false });

  document.addEventListener("pointerdown", function (e) {
    var canvas = e.target.closest && e.target.closest(".roadmap-canvas");
    if (!canvas || e.target.closest("button")) return;
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (activePointers.size === 1) {
      panGesture = { pointerId: e.pointerId, startX: e.clientX, startY: e.clientY, x: KANBAN_UI_STATE.viewport.x, y: KANBAN_UI_STATE.viewport.y };
    } else if (activePointers.size === 2) {
      var points = Array.from(activePointers.values());
      pinchGesture = { distance: Math.hypot(points[1].x - points[0].x, points[1].y - points[0].y) };
      panGesture = null;
    }
    canvas.classList.add("is-panning");
    canvas.setPointerCapture(e.pointerId);
  });

  document.addEventListener("pointermove", function (e) {
    if (!activePointers.has(e.pointerId)) return;
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinchGesture && activePointers.size >= 2) {
      var points = Array.from(activePointers.values()).slice(0, 2);
      var distance = Math.hypot(points[1].x - points[0].x, points[1].y - points[0].y);
      var centerX = (points[0].x + points[1].x) / 2;
      var centerY = (points[0].y + points[1].y) / 2;
      if (pinchGesture.distance > 0) zoomRoadmap(KANBAN_UI_STATE.viewport.scale * distance / pinchGesture.distance, centerX, centerY, false);
      pinchGesture.distance = distance;
      return;
    }
    if (!panGesture || panGesture.pointerId !== e.pointerId) return;
    KANBAN_UI_STATE.viewport.x = panGesture.x + e.clientX - panGesture.startX;
    KANBAN_UI_STATE.viewport.y = panGesture.y + e.clientY - panGesture.startY;
    applyViewport(false);
  });

  function endPan(e) {
    if (!activePointers.has(e.pointerId)) return;
    activePointers.delete(e.pointerId);
    pinchGesture = null;
    if (activePointers.size === 1) {
      var remaining = Array.from(activePointers.entries())[0];
      panGesture = { pointerId: remaining[0], startX: remaining[1].x, startY: remaining[1].y, x: KANBAN_UI_STATE.viewport.x, y: KANBAN_UI_STATE.viewport.y };
      return;
    }
    var canvas = document.querySelector(".roadmap-canvas");
    if (canvas) canvas.classList.remove("is-panning");
    panGesture = null;
  }
  document.addEventListener("pointerup", endPan);
  document.addEventListener("pointercancel", endPan);

  renderRoadmap();
  loadAll().then(function () {
    roadmapStatus = "ready";
    renderAll();
    startRealtimeSync();
  }).catch(function (err) {
    roadmapStatus = "error";
    roadmapError = err;
    renderRoadmap();
    showToast("讀取失敗：" + err.message, true);
    startRealtimeSync();
  });
})();
</script>
</body>
</html>
