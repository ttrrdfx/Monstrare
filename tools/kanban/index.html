<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>專案管理平台</title>
<style>
  :root {
    --paper: #f5f6f8;
    --surface: #ffffff;
    --surface-sunken: #eef0f3;
    --ink: #14181f;
    --ink-dim: #5b6472;
    --ink-faint: #8890a0;
    --line: #dde1e7;
    --line-strong: #c3c9d3;
    --accent: #3446d6;
    --accent-soft: #eaeefc;
    --good: #1f9d6b;
    --good-soft: #e4f5ee;
    --warn: #c9860a;
    --warn-soft: #fbf1de;
    --crit: #d23b3b;
    --crit-soft: #fbe8e8;
    --muted: #6b7280;
    --muted-soft: #eceef1;
    --shadow-card: 0 1px 2px rgba(20, 24, 31, 0.06), 0 1px 1px rgba(20, 24, 31, 0.04);
    --shadow-card-hover: 0 6px 20px rgba(20, 24, 31, 0.12);
    --shadow-modal: 0 24px 64px rgba(20, 24, 31, 0.28);
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-ui);
    font-size: 14px;
    color: var(--ink);
    background: var(--paper);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 { text-wrap: balance; font-weight: 650; }
  button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px rgba(52, 70, 214, 0.35);
    border-radius: 6px;
  }
  .tabular { font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--font-mono); }

  /* ── Top chrome ── */
  .topbar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
  .topbar-row1 { display: flex; align-items: baseline; justify-content: space-between; padding: 18px 28px 4px; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand-name { font-size: 18px; font-weight: 650; letter-spacing: -0.01em; }
  .brand-sub { font-size: 12.5px; color: var(--ink-dim); }
  .topbar-actions { display: flex; align-items: center; gap: 12px; margin-left: auto; }
  .sync-status { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--ink-dim); white-space: nowrap; }
  .sync-status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
  .sync-status[data-state="live"]::before { background: var(--good); }
  .sync-status[data-state="error"] { color: var(--crit); }
  .sync-status[data-state="error"]::before { background: var(--crit); }

  .view-tabs { display: flex; gap: 4px; background: var(--surface-sunken); border-radius: 10px; padding: 3px; }
  .view-tabs button { border: none; background: transparent; color: var(--ink-dim); font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 8px; transition: background-color .15s ease, color .15s ease; }
  .view-tabs button:hover { color: var(--ink); }
  .view-tabs button.is-active { background: var(--ink); color: #fff; }
  .update-trigger { min-height: 40px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 700; white-space: nowrap; transition: background-color .15s ease, color .15s ease; }
  .update-trigger:hover:not(:disabled) { background: var(--surface-sunken); }
  .update-trigger:disabled { cursor: not-allowed; color: var(--ink-faint); background: var(--surface-sunken); }
  .update-trigger-icon { color: var(--accent); font-size: 16px; line-height: 1; }
  .view { display: none; }
  .view.is-active { display: block; }

  /* ── pills ── */
  .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.02em; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .risk-low { background: var(--muted-soft); color: var(--muted); }
  .risk-medium { background: var(--warn-soft); color: var(--warn); }
  .risk-high { background: var(--crit-soft); color: var(--crit); }
  .agent-pill { background: var(--accent-soft); color: var(--accent); }
  .track-pill { background: var(--surface-sunken); color: var(--ink-dim); font-weight: 600; }
  .dep-pill.dep-blocked { background: var(--crit-soft); color: var(--crit); }
  .dep-pill.dep-missing { background: var(--warn-soft); color: var(--warn); }
  .dep-pill.dep-ok { background: var(--surface-sunken); color: var(--ink-dim); font-weight: 600; }
  .approval-pill { background: var(--surface); color: var(--ink-dim); border: 1px solid var(--line-strong); }
  .risk-stripe-low::before { background: var(--muted); }
  .risk-stripe-medium::before { background: var(--warn); }
  .risk-stripe-high::before { background: var(--crit); }

  /* ── card ── */
  .ticket-card {
    position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px 10px 14px; box-shadow: var(--shadow-card); cursor: grab;
    transition: box-shadow .15s ease, transform .15s ease, opacity .15s ease;
  }
  .ticket-card::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; }
  .ticket-card:hover { box-shadow: var(--shadow-card-hover); transform: translateY(-1px); }
  .ticket-card.is-dragging { opacity: 0.4; }
  .ticket-id { font-size: 10.5px; color: var(--ink-faint); font-weight: 600; letter-spacing: 0.02em; }
  .ticket-title { font-size: 13px; font-weight: 600; line-height: 1.35; margin: 3px 0 8px; }
  .ticket-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
  .ticket-meta-row { display: flex; align-items: center; justify-content: space-between; font-size: 11.5px; color: var(--ink-faint); }

  @media (prefers-reduced-motion: reduce) { .ticket-card, .modal, .modal-overlay { transition: none !important; } }

  /* ── lanes ── */
  .lanes { display: flex; gap: 1px; background: var(--line); overflow-x: auto; scroll-snap-type: x proximity; border-top: 1px solid var(--line); }
  .lane { flex: 0 0 232px; scroll-snap-align: start; background: var(--paper); min-height: calc(100vh - 156px); display: flex; flex-direction: column; }
  .lane.is-drag-over { background: var(--accent-soft); }
  .lane-head { position: sticky; top: 0; padding: 12px 12px 10px; border-bottom: 2px solid var(--line-strong); background: var(--paper); z-index: 1; }
  .lane-title-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .lane-title { font-size: 13px; font-weight: 700; }
  .lane-gauge { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--surface-sunken); color: var(--ink-dim); flex-shrink: 0; }
  .lane-gauge.is-over { background: var(--crit); color: #fff; }
  .lane-body { padding: 10px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .lane-empty { font-size: 11.5px; color: var(--ink-faint); padding: 10px 2px; }
  .lane-add-btn { border: 1px dashed var(--line-strong); background: transparent; color: var(--ink-faint); border-radius: 10px; padding: 8px; font-size: 12px; font-weight: 600; text-align: center; }
  .lane-add-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .lane-add-form { display: flex; flex-direction: column; gap: 6px; }
  .lane-add-form input { border: 1px solid var(--line-strong); border-radius: 8px; padding: 7px 9px; font-size: 12.5px; }
  .lane-add-form .row { display: flex; gap: 6px; }
  .lane-add-form button { border: none; border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 700; }
  .lane-add-form .save { background: var(--ink); color: #fff; flex: 1; }
  .lane-add-form .cancel { background: var(--surface-sunken); color: var(--ink-dim); }

  /* ── modal ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(20, 24, 31, 0.45); display: flex; align-items: flex-start; justify-content: center; padding: 5vh 20px; overflow-y: auto; z-index: 100; opacity: 0; transition: opacity .15s ease; }
  .modal-overlay.is-open { opacity: 1; }
  .modal-overlay[hidden] { display: none; }
  .modal { background: var(--surface); border-radius: 16px; width: 100%; max-width: 640px; box-shadow: var(--shadow-modal); transform: translateY(8px) scale(0.98); transition: transform .15s ease; }
  .modal-overlay.is-open .modal { transform: translateY(0) scale(1); }
  .modal-head { display: flex; align-items: flex-start; justify-content: space-between; padding: 20px 24px 0; gap: 12px; }
  .modal-id { font-size: 11.5px; color: var(--ink-faint); font-weight: 700; }
  .modal-title-input { font-size: 18px; font-weight: 700; margin: 4px 0 0; width: 100%; border: none; border-radius: 8px; padding: 4px 6px; margin-left: -6px; }
  .modal-title-input:hover, .modal-title-input:focus { background: var(--surface-sunken); }
  .modal-close { border: none; background: var(--surface-sunken); color: var(--ink-dim); width: 30px; height: 30px; border-radius: 8px; font-size: 15px; flex-shrink: 0; }
  .modal-close:hover { color: var(--ink); }
  .modal-meta-static { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px 20px; padding: 14px 24px 0; }
  .meta-item { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .meta-item-wide { grid-column: 1 / -1; }
  .meta-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-faint); }
  .meta-value { font-size: 13px; font-weight: 600; color: var(--ink); display: flex; align-items: center; gap: 6px; overflow-wrap: anywhere; }
  .stage-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .modal-body { padding: 18px 24px 24px; display: flex; flex-direction: column; gap: 20px; }
  .modal-section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); margin-bottom: 8px; display: block; }
  .content-input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; resize: vertical; min-height: 220px; }
  .refs-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .refs-list span { font-size: 11.5px; background: var(--surface-sunken); border-radius: 6px; padding: 3px 8px; }
  .comment { display: flex; gap: 10px; margin-bottom: 12px; }
  .comment-avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .comment-name { font-size: 12.5px; font-weight: 700; }
  .comment-time { font-size: 11px; color: var(--ink-faint); font-weight: 400; margin-left: 6px; }
  .comment-text { font-size: 13px; color: var(--ink-dim); margin-top: 2px; line-height: 1.5; white-space: pre-wrap; }
  .no-comment { font-size: 13px; color: var(--ink-faint); margin-bottom: 10px; }
  .comment-form { display: flex; gap: 8px; align-items: flex-start; }
  .comment-form textarea { flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; min-height: 40px; resize: vertical; }
  .comment-form button { border: none; background: var(--ink); color: #fff; border-radius: 8px; padding: 8px 14px; font-size: 12.5px; font-weight: 700; align-self: flex-start; }
  .modal-footer { display: flex; justify-content: space-between; padding: 0 24px 22px; }
  .danger-btn { border: 1px solid var(--crit-soft); background: var(--crit-soft); color: var(--crit); border-radius: 8px; padding: 7px 14px; font-size: 12.5px; font-weight: 700; }
  .danger-btn:hover { background: var(--crit); color: #fff; }

  /* ── version update: Variant A centered summary dialog ── */
  .upgrade-overlay { position: fixed; inset: 0; z-index: 300; display: flex; align-items: flex-start; justify-content: center; padding: 5vh 20px; overflow-y: auto; background: rgba(20, 24, 31, 0.48); opacity: 0; transition: opacity .15s ease; }
  .upgrade-overlay.is-open { opacity: 1; }
  .upgrade-overlay[hidden] { display: none; }
  .upgrade-dialog { width: 100%; max-width: 680px; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow-modal); transform: translateY(8px) scale(.98); transition: transform .15s ease; }
  .upgrade-overlay.is-open .upgrade-dialog { transform: translateY(0) scale(1); }
  .upgrade-dialog-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 24px 24px 16px; }
  .upgrade-eyebrow { margin-bottom: 4px; color: var(--ink-faint); font-size: 11px; font-weight: 700; text-transform: uppercase; }
  .upgrade-dialog-title { font-size: 20px; line-height: 1.25; }
  .upgrade-dialog-copy { max-width: 58ch; margin-top: 8px; color: var(--ink-dim); font-size: 13px; line-height: 1.6; }
  .upgrade-icon-button { flex: 0 0 auto; width: 36px; height: 36px; border: 0; border-radius: 8px; color: var(--ink-dim); background: var(--surface-sunken); font-size: 18px; }
  .upgrade-icon-button:hover:not(:disabled) { color: var(--ink); }
  .upgrade-icon-button:disabled { cursor: not-allowed; opacity: .55; }
  .upgrade-dialog-body { padding: 0 24px 24px; overflow: auto; overscroll-behavior: contain; }
  .upgrade-dialog-foot { display: flex; justify-content: flex-end; gap: 12px; padding: 16px 24px 20px; background: var(--surface); border-top: 1px solid var(--line); }
  .upgrade-status-banner { display: flex; gap: 12px; padding: 16px; border-radius: 12px; background: var(--accent-soft); }
  .upgrade-status-banner.is-good { background: var(--good-soft); }
  .upgrade-status-banner.is-warn { background: var(--warn-soft); }
  .upgrade-status-banner.is-crit { background: var(--crit-soft); }
  .upgrade-status-icon { flex: 0 0 auto; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; color: var(--surface); background: var(--accent); font-weight: 700; }
  .upgrade-status-banner.is-good .upgrade-status-icon { background: var(--good); }
  .upgrade-status-banner.is-warn .upgrade-status-icon { background: var(--warn); }
  .upgrade-status-banner.is-crit .upgrade-status-icon { background: var(--crit); }
  .upgrade-status-banner h2 { margin-bottom: 4px; font-size: 14px; line-height: 1.3; }
  .upgrade-status-banner p { color: var(--ink-dim); font-size: 13px; line-height: 1.6; }
  .upgrade-version-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; margin: 24px 0; }
  .upgrade-version-card { min-width: 0; padding: 16px; border-radius: 12px; background: var(--surface-sunken); }
  .upgrade-version-card small { display: block; margin-bottom: 8px; color: var(--ink-faint); font-size: 11px; font-weight: 700; }
  .upgrade-version-card strong { display: block; font-size: 20px; }
  .upgrade-version-card span { display: block; margin-top: 4px; overflow: hidden; color: var(--ink-dim); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
  .upgrade-version-arrow { color: var(--ink-faint); font-size: 20px; }
  .upgrade-change-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 20px 0; }
  .upgrade-change-stat { padding: 12px; border-radius: 10px; text-align: center; background: var(--surface-sunken); }
  .upgrade-change-stat strong { display: block; margin-bottom: 4px; font-size: 18px; }
  .upgrade-change-stat span { color: var(--ink-dim); font-size: 11px; font-weight: 700; }
  .upgrade-change-stat.is-conflict { color: var(--crit); background: var(--crit-soft); }
  .upgrade-details { margin-top: 16px; border-radius: 10px; background: var(--surface-sunken); }
  .upgrade-details summary { padding: 14px 16px; border-radius: 10px; cursor: pointer; color: var(--ink-dim); font-size: 13px; font-weight: 700; }
  .upgrade-path-groups { padding: 0 16px 16px; }
  .upgrade-path-group + .upgrade-path-group { margin-top: 16px; }
  .upgrade-path-group h3 { margin-bottom: 4px; color: var(--ink-faint); font-size: 11px; line-height: 1.3; text-transform: uppercase; }
  .upgrade-path-list { margin: 0; padding-left: 20px; color: var(--ink-dim); font-family: var(--font-mono); font-size: 11px; line-height: 1.8; overflow-wrap: anywhere; }
  .upgrade-button { min-height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px; border: 0; border-radius: 8px; background: var(--surface-sunken); color: var(--ink); font-size: 13px; font-weight: 700; }
  .upgrade-button:hover:not(:disabled) { background: var(--line); }
  .upgrade-button.is-primary { color: var(--surface); background: var(--ink); }
  .upgrade-button.is-primary:hover:not(:disabled) { background: var(--ink-dim); }
  .upgrade-button:disabled { cursor: not-allowed; color: var(--ink-faint); background: var(--surface-sunken); opacity: .7; }
  .upgrade-progress { padding: 8px 0 4px; }
  .upgrade-progress-row { min-height: 56px; display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 12px; }
  .upgrade-progress-dot { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; color: var(--ink-faint); background: var(--surface-sunken); font-size: 12px; font-weight: 700; }
  .upgrade-progress-row.is-active .upgrade-progress-dot { color: var(--surface); background: var(--accent); }
  .upgrade-progress-row.is-done .upgrade-progress-dot { color: var(--surface); background: var(--good); }
  .upgrade-progress-row strong { display: block; font-size: 13px; }
  .upgrade-progress-row span { color: var(--ink-faint); font-size: 11px; }
  .upgrade-spinner { width: 16px; height: 16px; border: 2px solid var(--line-strong); border-top-color: var(--accent); border-radius: 50%; animation: upgrade-spin .8s linear infinite; }
  @keyframes upgrade-spin { to { transform: rotate(360deg); } }
  .upgrade-notice { margin-top: 20px; padding: 16px; border-radius: 12px; background: var(--warn-soft); }
  .upgrade-notice strong { display: block; margin-bottom: 4px; font-size: 13px; }
  .upgrade-notice p { color: var(--ink-dim); font-size: 12px; line-height: 1.6; }
  .upgrade-live { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  .upgrade-confirm-overlay { position: fixed; inset: 0; z-index: 320; display: grid; place-items: center; padding: 20px; background: rgba(20, 24, 31, .56); }
  .upgrade-confirm-overlay[hidden] { display: none; }
  .upgrade-confirm { width: 100%; max-width: 480px; padding: 24px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow-modal); }
  .upgrade-confirm h2 { font-size: 20px; line-height: 1.25; }
  .upgrade-confirm p { margin-top: 12px; color: var(--ink-dim); font-size: 13px; line-height: 1.6; }
  .upgrade-confirm-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }

  /* ── roadmap: Variant C focused tree ── */
  .progress-bar { height: 6px; border-radius: 4px; background: var(--surface-sunken); overflow: hidden; }
  .progress-bar > span { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  .roadmap-shell { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: calc(100vh - 68px); }
  .epic-nav { background: var(--surface); border-right: 1px solid var(--line); padding: 24px 16px; }
  .epic-nav-title { font-size: 16px; margin: 0 8px 20px; }
  .epic-nav-list { display: flex; flex-direction: column; gap: 8px; }
  .epic-nav-item { border: 0; background: transparent; border-radius: 12px; padding: 16px; text-align: left; min-width: 0; }
  .epic-nav-item:hover { background: var(--surface-sunken); }
  .epic-nav-item.is-active { background: var(--accent-soft); color: var(--accent); }
  .epic-nav-name { display: block; font-size: 14px; font-weight: 700; line-height: 1.3; }
  .epic-nav-progress { display: block; font-size: 11px; color: var(--ink-dim); margin-top: 8px; }
  .roadmap-main { min-width: 0; overflow: hidden; }
  .roadmap-head { min-height: 76px; padding: 16px 28px; background: var(--surface); display: flex; align-items: center; justify-content: space-between; gap: 24px; }
  .roadmap-head h2 { font-size: 20px; line-height: 1.25; }
  .roadmap-head p { font-size: 12px; color: var(--ink-dim); line-height: 1.5; margin-top: 4px; max-width: 72ch; }
  .roadmap-mode { flex-shrink: 0; font-size: 12px; color: var(--ink-dim); font-weight: 700; }
  .roadmap-mode::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-right: 8px; }
  .roadmap-mode.is-error { color: var(--warn); }
  .roadmap-mode.is-error::before { background: var(--warn); }
  .roadmap-canvas { position: relative; min-height: calc(100vh - 144px); overflow: hidden; touch-action: none; cursor: grab; background-image: radial-gradient(var(--line-strong) .7px, transparent .7px); background-size: 24px 24px; }
  .roadmap-canvas.is-panning { cursor: grabbing; user-select: none; }
  .tree-stage { position: absolute; left: 0; top: 0; min-width: 1040px; min-height: 620px; transform-origin: 0 0; will-change: transform; }
  .tree-svg { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  .tree-edge { fill: none; stroke: var(--line-strong); stroke-width: 2; }
  .tree-node { position: absolute; z-index: 1; border: 0; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow-card); padding: 16px; text-align: left; overflow: hidden; }
  button.tree-node:hover { box-shadow: var(--shadow-card-hover); transform: translateY(-1px); }
  .tree-node-root { width: 232px; min-height: 132px; border-left: 4px solid var(--accent); padding: 20px; }
  .tree-node-story { width: 248px; min-height: 112px; border-left: 4px solid var(--good); }
  .tree-node-story.is-unclassified { border-left-color: var(--warn); }
  .tree-node-task { width: 288px; min-height: 76px; }

<script type="module">
/* roadmap-data:start */
const UNCLASSIFIED_STORY_NAME = "（未分類任務）";

function percentage(done, total) {
  return total ? Math.round((done / total) * 100) : 0;
}

function progressFor(tasks) {
  const list = Array.isArray(tasks) ? tasks : [];
  const done = list.filter((task) => task && task.stage === "done").length;
  return { done, total: list.length, percent: percentage(done, list.length) };
}

function compareTasks(a, b) {
  const aOrder = Number.isFinite(a && a.order) ? a.order : Number.MAX_SAFE_INTEGER;
  const bOrder = Number.isFinite(b && b.order) ? b.order : Number.MAX_SAFE_INTEGER;
  if (aOrder !== bOrder) return aOrder - bOrder;
  return String((a && a.id) || "").localeCompare(String((b && b.id) || ""));
}

export function createKanbanUiState() {
  return {
    selectedEpicName: null,
    collapsedBranches: new Set(),
    viewport: { scale: 1, x: 0, y: 0 },
    syncState: "connecting"
  };
}

export function clampZoom(scale) {
  return Math.min(1.6, Math.max(0.25, Number.isFinite(scale) ? scale : 1));
}

export function wheelZoomFactor(deltaY, deltaMode, pageHeight) {
  const rawDelta = Number.isFinite(deltaY) ? deltaY : 0;
  const pixelsPerUnit = deltaMode === 1
    ? 16
    : deltaMode === 2
      ? Math.max(1, Number.isFinite(pageHeight) ? pageHeight : 800)
      : 1;
  const pixelDelta = Math.max(-120, Math.min(120, rawDelta * pixelsPerUnit));
  return Math.exp(-pixelDelta * 0.001);
}

export function wheelPanDelta(delta, deltaMode, pageHeight) {
  if (!Number.isFinite(delta)) return 0;
  if (deltaMode === 1) return delta * 16;
  if (deltaMode === 2) return delta * Math.max(1, Number.isFinite(pageHeight) ? pageHeight : 800);
  return delta;
}

export function fitViewport(contentWidth, contentHeight, viewportWidth, viewportHeight, padding) {
  const inset = Number.isFinite(padding) ? Math.max(0, padding) : 32;
  const availableWidth = Math.max(1, viewportWidth - inset * 2);
  const availableHeight = Math.max(1, viewportHeight - inset * 2);
  const scale = clampZoom(Math.min(availableWidth / Math.max(1, contentWidth), availableHeight / Math.max(1, contentHeight)));
  return {
    scale,
    x: Math.round((viewportWidth - contentWidth * scale) / 2),
    y: Math.round((viewportHeight - contentHeight * scale) / 2)
  };
}

export function resolveSelectedEpicName(epics, selectedEpicName) {
  const list = Array.isArray(epics) ? epics : [];
  if (list.some((epic) => epic && epic.name === selectedEpicName)) return selectedEpicName;
  return list.length && list[0] ? list[0].name : null;
}

export function buildEpicProgress(epics, tickets) {
  const epicList = Array.isArray(epics) ? epics : [];
  const ticketList = Array.isArray(tickets) ? tickets : [];
  return epicList.map((epic) => {
    const tasks = ticketList.filter((task) => task && task.epic === epic.name);
    return { name: epic.name, definition: epic.definition || "", progress: progressFor(tasks) };
  });
}

export function buildSelectedEpicTree(epics, tickets, selectedEpicName) {
  const epicList = Array.isArray(epics) ? epics : [];
  const ticketList = Array.isArray(tickets) ? tickets : [];
  const resolvedName = resolveSelectedEpicName(epicList, selectedEpicName);
  if (resolvedName === null) return null;

  const epic = epicList.find((item) => item && item.name === resolvedName);
  const epicTasks = ticketList.filter((task) => task && task.epic === resolvedName);
  const definitions = Array.isArray(epic.stories) ? epic.stories : [];
  const storyNames = new Set(definitions.map((story) => story && story.name));
  const stories = definitions.map((story) => {
    const tasks = epicTasks.filter((task) => task.userStory === story.name).sort(compareTasks);
    return {
      name: story.name,
      definition: story.definition || "",
      unclassified: false,
      progress: progressFor(tasks),
      tasks
    };
  });
  const unclassified = epicTasks.filter((task) => !storyNames.has(task.userStory)).sort(compareTasks);

  if (unclassified.length) {
    stories.push({
      name: UNCLASSIFIED_STORY_NAME,
      definition: "屬於這個 Epic，但還沒指定 User Story。",
      unclassified: true,
      progress: progressFor(unclassified),
      tasks: unclassified
    });
  }

  return {
    name: epic.name,
    definition: epic.definition || "",
    progress: progressFor(epicTasks),
    stories
  };
}

export function buildFocusedTreeLayout(tree, collapsedBranchNames) {
  if (!tree) return { width: 0, height: 0, nodes: [], edges: [] };
  const collapsed = collapsedBranchNames instanceof Set ? collapsedBranchNames : new Set();
  const epicCollapsed = collapsed.has(tree.name + "::*");
  const nodes = [];
  const edges = [];
  const left = { root: 64, story: 400, task: 752 };
  const sizes = { root: { width: 232, height: 132 }, story: { width: 248, height: 112 }, task: { width: 288, height: 76 } };
  const visibleStories = epicCollapsed ? [] : tree.stories || [];
  let cursorY = 64;

  visibleStories.forEach((story, storyIndex) => {
    const storyKey = tree.name + "::" + story.name;
    const isCollapsed = collapsed.has(storyKey);
    const visibleTasks = isCollapsed ? [] : story.tasks;
    const branchHeight = Math.max(sizes.story.height, visibleTasks.length ? visibleTasks.length * 92 - 16 : sizes.story.height);
    const storyY = cursorY + Math.max(0, (branchHeight - sizes.story.height) / 2);
    const storyId = "story-" + storyIndex;
    nodes.push({ id: storyId, type: "story", x: left.story, y: storyY, width: sizes.story.width, height: sizes.story.height, story, collapsed: isCollapsed });

    visibleTasks.forEach((task, taskIndex) => {
      const taskY = cursorY + taskIndex * 92;
      const taskId = "task-" + storyIndex + "-" + taskIndex;
      nodes.push({ id: taskId, type: "task", x: left.task, y: taskY, width: sizes.task.width, height: sizes.task.height, task });
      edges.push({ from: storyId, to: taskId });
    });
    cursorY += branchHeight + 32;
  });

  const height = Math.max(620, cursorY + 32);
  const rootY = Math.max(64, (height - sizes.root.height) / 2);
  nodes.unshift({ id: "root", type: "root", x: left.root, y: rootY, width: sizes.root.width, height: sizes.root.height, tree, collapsed: epicCollapsed });
  visibleStories.forEach((story, storyIndex) => edges.unshift({ from: "root", to: "story-" + storyIndex }));
  return { width: epicCollapsed ? 360 : 1104, height, nodes, edges };
}
/* roadmap-data:end */

/* realtime-sync:start */
export function parseChangeResources(rawData) {
  try {
    const data = JSON.parse(rawData);
    if (!data || !Array.isArray(data.resources)) return [];
    return Array.from(new Set(data.resources.filter((resource) => resource === "cards" || resource === "epics")));
  } catch (_) {
    return [];
  }
}

export function mergeChangeResources(current, incoming) {
  return Array.from(new Set([].concat(current || [], incoming || [])))
    .filter((resource) => resource === "cards" || resource === "epics");
}

export function createLatestRequestGate() {
  const sequences = new Map();
  return {
    begin(resource) {
      const sequence = (sequences.get(resource) || 0) + 1;
      sequences.set(resource, sequence);
      return sequence;
    },
    isLatest(resource, candidate) { return candidate === sequences.get(resource); }
  };
}
/* realtime-sync:end */

/* upgrade-ui:start */
const UPGRADE_PHASES = new Set([
  "idle", "checking", "current", "available", "blocked", "error",
  "confirming", "applying", "success", "verification-failed"
]);
const UPGRADE_ACTIONS = ["add", "update", "remove", "preserve", "conflict"];

function upgradeCounts(value) {
  const source = value && typeof value === "object" ? value : {};
  return Object.fromEntries(UPGRADE_ACTIONS.map((action) => [
    action,
    Number.isFinite(source[action]) && source[action] > 0 ? Math.floor(source[action]) : 0
  ]));
}

export function groupUpgradeEntries(entries) {
  const groups = Object.fromEntries(UPGRADE_ACTIONS.map((action) => [action, []]));
  (Array.isArray(entries) ? entries : []).forEach((entry) => {
    if (!entry || !UPGRADE_ACTIONS.includes(entry.action) || typeof entry.path !== "string") return;
    groups[entry.action].push(entry.path);
  });
  UPGRADE_ACTIONS.forEach((action) => groups[action].sort((a, b) => a.localeCompare(b)));
  return groups;
}

export function createUpgradeState() {
  return { phase: "idle", plan: null, error: null, result: null };
}

export function classifyUpgradePlan(plan) {
  const counts = upgradeCounts(plan && plan.counts);
  const writeCount = counts.add + counts.update + counts.remove;
  const writable = !(plan && (plan.writable === false || (plan.writable && plan.writable.ok === false)));
  if (!plan || plan.applicable !== true || counts.conflict > 0 || !writable) return "blocked";
  if (plan.installedVersion === plan.sourceVersion || writeCount === 0) return "current";
  return "available";
}

export function mapUpgradeError(error) {
  const code = error && typeof error.code === "string" ? error.code : "UPGRADE_UNKNOWN";
  const known = {
    GITHUB_RELEASE_TIMEOUT: ["無法從 GitHub 檢查更新", "GitHub 回應逾時。目標專案沒有被修改，可以稍後重試。", true],
    GITHUB_RELEASE_UNAVAILABLE: ["無法從 GitHub 檢查更新", "暫時無法取得正式 Release。目標專案沒有被修改。", true],
    GITHUB_RELEASE_RATE_LIMITED: ["GitHub 檢查次數已達上限", "請稍後再重新檢查，專案沒有被修改。", true],
    GITHUB_RELEASE_FORBIDDEN: ["GitHub 拒絕版本檢查", "請確認網路或 GitHub 服務狀態後重試。", true],
    UPGRADE_NETWORK_ERROR: ["無法連上看板 server", "請確認本機 server 仍在執行後重試。", true],
    UPGRADE_PLAN_EXPIRED: ["更新計畫已過期", "為避免套用過時內容，請重新檢查版本。", true],
    UPGRADE_PLAN_STALE: ["更新計畫已改變", "專案或來源已變更，請重新檢查後再決定。", true],
    UPGRADE_BUSY: ["另一個更新正在進行", "請等待目前的更新完成後再試。", true],
    UPGRADE_CONFLICT: ["專案內容已變更", "沒有套用任何變更；請重新檢查衝突。", true],
    UPGRADE_ORIGIN_FORBIDDEN: ["請求來源未通過檢查", "請從目前的本機看板重新開啟版本更新。", false],
    UPGRADE_WRITE_FORBIDDEN: ["目前無法寫入專案", "你仍可預覽變更，但套用更新已停用。", false],
    UPGRADE_ROLLBACK_FAILED: ["更新失敗且回復未完成", "請保留目前畫面，依備份資訊進行人工復原。", false],
    UPGRADE_TRANSACTION_FAILED: ["更新未完成", "更新已停止並嘗試回復，請查看詳細資訊。", true]
  };
  const match = known[code] || ["版本更新發生錯誤", "目標專案沒有被修改；請稍後重試。", true];
  return { code, title: match[0], message: match[1], retryable: match[2] };
}

export function selectUpgradeView(state, now) {
  const safeState = state && UPGRADE_PHASES.has(state.phase) ? state : createUpgradeState();
  const plan = safeState.plan;
  const counts = upgradeCounts(plan && plan.counts);
  const writeCount = counts.add + counts.update + counts.remove;
  const expiresAt = plan && Date.parse(plan.expiresAt);
  const currentTime = Number.isFinite(now) ? now : Date.now();
  const expired = Number.isFinite(expiresAt) && expiresAt <= currentTime;
  const writable = !(plan && (plan.writable === false || (plan.writable && plan.writable.ok === false)));
  const canApply = safeState.phase === "available" && plan && plan.applicable === true &&
    counts.conflict === 0 && writeCount > 0 && writable && !expired &&
    typeof plan.planToken === "string" && plan.planToken.length > 0 && Number.isFinite(expiresAt);
  return {
    phase: safeState.phase,
    counts,
    writeCount,
    expired,
    writable,
    canApply: Boolean(canApply),
    canClose: safeState.phase !== "applying",
    error: safeState.error ? mapUpgradeError(safeState.error) : null,
    groups: groupUpgradeEntries(plan && plan.entries)
  };
}

export function upgradeReducer(state, event) {
  const current = state && UPGRADE_PHASES.has(state.phase) ? state : createUpgradeState();
  const action = event && event.type;
  if ((action === "OPEN" || action === "RECHECK") && current.phase !== "applying" && current.phase !== "confirming") {
    return { phase: "checking", plan: null, error: null, result: null, notice: event.notice || null };
  }
  if (action === "CHECK_SUCCESS" && current.phase === "checking" && event.plan) {
    return { phase: classifyUpgradePlan(event.plan), plan: event.plan, error: null, result: null };
  }
  if (action === "CHECK_FAILURE" && current.phase === "checking") {
    return { phase: "error", plan: null, error: event.error || {}, result: null };
  }
  if (action === "REQUEST_APPLY" && selectUpgradeView(current, event.now).canApply) {
    return { ...current, phase: "confirming" };
  }
  if (action === "CANCEL_CONFIRM" && current.phase === "confirming") {
    return { ...current, phase: "available" };
  }
  if (action === "APPLY_REQUEST" && current.phase === "confirming" &&
      selectUpgradeView({ ...current, phase: "available" }, event.now).canApply) {
    return { ...current, phase: "applying", error: null };
  }
  if (action === "APPLY_SUCCESS" && current.phase === "applying" && event.result) {
    const verificationFailed = event.result.verification && event.result.verification.ok === false;
    return { ...current, phase: verificationFailed ? "verification-failed" : "success", result: event.result };
  }
  if (action === "APPLY_FAILURE" && current.phase === "applying") {
    return { ...current, phase: "error", error: event.error || {}, result: null };
  }
  if (action === "CLOSE" && current.phase !== "applying") return createUpgradeState();
  return current;
}

export function escapeUpgradeHtml(value) {
  return String(value).replace(/[&<>"']/g, (character) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[character]);
}

export function createUpgradeApiAdapter(fetcher) {
  let localStatus = null;
  let statusRequest = null;
  async function request(path, options) {
    let response;
    try { response = await fetcher(path, options); }
    catch { throw { code: "UPGRADE_NETWORK_ERROR" }; }
    let payload;
    try { payload = await response.json(); }
    catch { throw { code: "UPGRADE_NETWORK_ERROR" }; }
    if (!response.ok) {
      const error = payload && payload.error && typeof payload.error === "object" ? payload.error : {};
      throw { code: error.code || "UPGRADE_UNKNOWN", applied: payload && payload.applied, backupPath: payload && payload.backupPath };
    }
    return payload;
  }
  const post = (path, body) => request(path, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
  });
  return {
    status: () => {
      statusRequest = request("/api/upgrade/status").then((status) => { localStatus = status; return status; });
      return statusRequest;
    },
    check: async () => {
      if (statusRequest) await statusRequest.catch(() => {});
      return { ...await post("/api/upgrade/check", {}), writable: localStatus && localStatus.writable };
    },
    apply: (plan) => post("/api/upgrade/apply", {
      expectedInstalledVersion: plan.installedVersion,
      expectedSourceVersion: plan.sourceVersion,
      planToken: plan.planToken,
      confirm: true
    })
  };
}

export function createUpgradeIntegration(adapter, onChange) {
  let state = createUpgradeState();
  let sequence = 0;
  const publish = (next) => { state = next; if (onChange) onChange(state); return state; };
  function check(type, notice) {
    if (state.phase === "applying" || state.phase === "confirming") return;
    const current = ++sequence;
    publish(upgradeReducer(state, { type, notice }));
    return Promise.resolve().then(() => adapter.check()).then((plan) => {
      if (current === sequence && state.phase === "checking") publish(upgradeReducer(state, { type: "CHECK_SUCCESS", plan }));
    }).catch((error) => {
      if (current === sequence && state.phase === "checking") publish(upgradeReducer(state, { type: "CHECK_FAILURE", error }));
    });
  }
  return {
    getState: () => state,
    open: () => check("OPEN"),
    recheck: (notice) => check("RECHECK", notice),
    close: () => { if (state.phase !== "applying") { ++sequence; publish(upgradeReducer(state, { type: "CLOSE" })); } },
    requestApply: () => publish(upgradeReducer(state, { type: "REQUEST_APPLY", now: Date.now() })),
    cancelConfirm: () => publish(upgradeReducer(state, { type: "CANCEL_CONFIRM" })),
    async confirmApply() {
      if (state.phase !== "confirming") return;
      const plan = state.plan;
      const next = upgradeReducer(state, { type: "APPLY_REQUEST", now: Date.now() });
      if (next.phase !== "applying") {
        publish(upgradeReducer(state, { type: "CANCEL_CONFIRM" }));
        return check("RECHECK", "更新計畫已過期，正在重新檢查。");
      }
      publish(next);
      try {
        const result = await adapter.apply(plan);
        publish(upgradeReducer(state, { type: "APPLY_SUCCESS", result }));
      } catch (error) {
        if (error.code === "UPDATE_APPLIED_VERIFICATION_FAILED" && error.applied) {
          publish(upgradeReducer(state, { type: "APPLY_SUCCESS", result: error.applied }));
        } else if (error.code === "UPGRADE_PLAN_STALE" || error.code === "UPGRADE_PLAN_EXPIRED") {
          publish(upgradeReducer(state, { type: "APPLY_FAILURE", error }));
          return check("RECHECK", "計畫已改變，正在重新檢查；請重新確認後再更新。");
        } else publish(upgradeReducer(state, { type: "APPLY_FAILURE", error }));
      }
    }
  };
}

      if (!checks.length) {

        summaryItem.textContent = failed ? "驗證未通過；未取得細項，請執行 npm run check。" : "驗證通過。";
        verificationList.appendChild(summaryItem);
      }
      checks.forEach(function (check) {
        var item = document.createElement("li");
        item.textContent = String(check.label || check.id || "檢查") + "：" + String(check.status || "未知");
        verificationList.appendChild(item);
      });
      footer.innerHTML = '<button class="upgrade-button is-primary" data-upgrade-close type="button">我知道了</button>';
      liveMessage = body.querySelector("[data-upgrade-result-title]").textContent;
    }

    var closeButton = dialog.querySelector("#upgrade-close");
    if (closeButton) closeButton.disabled = !view.canClose;
    setUpgradeText(dialog, "#upgrade-live", liveMessage);
    if (previousFocusId) {
      var restored = document.getElementById(previousFocusId);
      if (restored && dialog.contains(restored)) restored.focus();
    }
    renderUpgradeConfirmation();
  }

  function renderUpgradeConfirmation() {
    var overlay = document.getElementById("upgrade-confirm-overlay");
    var dialog = document.getElementById("upgrade-dialog");
    if (upgradeState.phase !== "confirming") {
      overlay.hidden = true;
      dialog.inert = false;
      return;
    }
    var plan = upgradeState.plan || {};
    var view = selectUpgradeView({ ...upgradeState, phase: "available" });
    dialog.inert = true;
    overlay.hidden = false;
    var confirm = document.getElementById("upgrade-confirm");
    confirm.innerHTML = '<h2 id="upgrade-confirm-title" tabindex="-1">確認套用版本更新？</h2><p>將從 <strong data-confirm-from></strong> 更新至 <strong data-confirm-to></strong>，新增 <strong data-confirm-add></strong>、更新 <strong data-confirm-update></strong>、移除 <strong data-confirm-remove></strong>，共寫入 <strong data-confirm-count></strong> 個路徑。套用前會先建立備份。</p><div class="upgrade-confirm-actions"><button class="upgrade-button" data-upgrade-cancel-confirm type="button">返回預覽</button><button class="upgrade-button is-primary" id="upgrade-confirm-apply" data-upgrade-confirm-apply type="button">確認並套用</button></div>';
    setUpgradeText(confirm, "[data-confirm-from]", versionLabel(plan.installedVersion));
    setUpgradeText(confirm, "[data-confirm-to]", versionLabel(plan.sourceVersion));
    setUpgradeText(confirm, "[data-confirm-count]", view.writeCount);
    ["add", "update", "remove"].forEach(function (action) { setUpgradeText(confirm, "[data-confirm-" + action + "]", view.counts[action]); });
    requestAnimationFrame(function () { var title = document.getElementById("upgrade-confirm-title"); if (title && upgradeState.phase === "confirming") title.focus(); });
  }

  function runUpgradeCheck(eventType) {
    return eventType === "OPEN" ? upgradeIntegration.open() : upgradeIntegration.recheck();
  }

  function openUpgradeDialog() {
    var overlay = document.getElementById("upgrade-overlay");
    overlay.hidden = false;
    setUpgradeBackgroundInert(true);
    requestAnimationFrame(function () {
      overlay.classList.add("is-open");
      document.getElementById("upgrade-title").focus();
    });
    runUpgradeCheck("OPEN");
  }

  function closeUpgradeDialog() {
    if (!selectUpgradeView(upgradeState).canClose) return;
    upgradeIntegration.close();
    var overlay = document.getElementById("upgrade-overlay");
    document.getElementById("upgrade-confirm-overlay").hidden = true;
    document.getElementById("upgrade-dialog").inert = false;
    overlay.classList.remove("is-open");
    setUpgradeBackgroundInert(false);
    setTimeout(function () {
      overlay.hidden = true;
      document.getElementById("upgrade-trigger").focus();
    }, 150);
  }

  function applyUpgradeConfirmed() {
    var request = upgradeIntegration.confirmApply();
    requestAnimationFrame(function () { var title = document.getElementById("upgrade-title"); if (title) title.focus(); });
    return request;
  }

  function copyUpgradeValue(kind) {
    var value = kind === "backup"
      ? upgradeState.result && upgradeState.result.backupPath
      : selectUpgradeView(upgradeState).error && selectUpgradeView(upgradeState).error.code;
    if (!value || !navigator.clipboard) return showToast("無法使用剪貼簿", true);
    navigator.clipboard.writeText(value).then(function () { showToast("已複製", false); }).catch(function () { showToast("複製失敗", true); });
  }

  function handleUpgradeClick(event) {
    var target = event.target.closest && event.target.closest("#upgrade-trigger, [data-upgrade-close], [data-upgrade-retry], [data-upgrade-request], [data-upgrade-cancel-confirm], [data-upgrade-confirm-apply], [data-upgrade-copy]");
    if (target && target.id === "upgrade-trigger") { openUpgradeDialog(); return true; }
    if (target && target.hasAttribute("data-upgrade-close")) { closeUpgradeDialog(); return true; }
    if (target && target.hasAttribute("data-upgrade-retry")) { runUpgradeCheck("RECHECK"); return true; }
    if (target && target.hasAttribute("data-upgrade-request")) { upgradeIntegration.requestApply(); return true; }
    if (target && target.hasAttribute("data-upgrade-cancel-confirm")) {
      upgradeIntegration.cancelConfirm();
      requestAnimationFrame(function () { var action = document.getElementById("upgrade-request-apply"); if (action) action.focus(); });
      return true;
    }
    if (target && target.hasAttribute("data-upgrade-confirm-apply")) { applyUpgradeConfirmed(); return true; }
    if (target && target.hasAttribute("data-upgrade-copy")) { copyUpgradeValue(target.dataset.upgradeCopy); return true; }
    if (event.target === document.getElementById("upgrade-overlay") && !document.getElementById("upgrade-overlay").hidden) { closeUpgradeDialog(); return true; }
    return false;
  }

  function trapUpgradeFocus(event, root) {
    var focusable = Array.from(root.querySelectorAll('button:not(:disabled), summary, [tabindex]:not([tabindex="-1"])')).filter(function (element) { return !element.closest("[inert]"); });
    if (!focusable.length) return false;
    var first = focusable[0];
    var last = focusable[focusable.length - 1];
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); return true; }
    if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); return true; }
    return false;
  }

  function handleUpgradeKeydown(event) {
    var overlay = document.getElementById("upgrade-overlay");
    if (overlay.hidden) return false;
    if (event.key === "Escape") {
      event.preventDefault();
      if (upgradeState.phase === "applying") return true;
      if (upgradeState.phase === "confirming") {
        upgradeIntegration.cancelConfirm();
        requestAnimationFrame(function () { var action = document.getElementById("upgrade-request-apply"); if (action) action.focus(); });
      } else closeUpgradeDialog();
      return true;
    }
    if (event.key === "Tab") {
      var confirmOverlay = document.getElementById("upgrade-confirm-overlay");
      return trapUpgradeFocus(event, confirmOverlay.hidden ? document.getElementById("upgrade-dialog") : document.getElementById("upgrade-confirm"));
    }
    return false;
  }
  /* upgrade-runtime:end */

  /* ── render: lanes ── */
  function dependsOnBadge(tk) {
    if (!tk.dependsOn || !tk.dependsOn.length) return "";
    var missing = [], unmet = [];
    tk.dependsOn.forEach(function (id) {
      var dep = getTicket(id);
      if (!dep) missing.push(id); else if (dep.stage !== "done") unmet.push(id);
    });
    if (missing.length) return '<span class="pill dep-pill dep-missing">⚠️ 依賴的卡片已不存在</span>';
    if (unmet.length) return '<span class="pill dep-pill dep-blocked">⛔ 依賴 ' + unmet.length + ' 張未完成</span>';
    return '<span class="pill dep-pill dep-ok">🔗 依賴 ' + tk.dependsOn.length + ' 張（已完成）</span>';
  }

  function cardHtml(tk) {
    var badges = '<span class="pill risk-' + tk.risk + '">' + riskLabel(tk.risk) + "</span>";
    if (tk.track && tk.track !== "n/a") badges += '<span class="pill track-pill">' + trackLabel(tk.track) + "</span>";
    if (tk.agent) badges += '<span class="pill agent-pill">' + escapeHtml(tk.agent) + "</span>";
    if (tk.approvalRequired) badges += '<span class="pill approval-pill">需人工核准</span>';
    badges += dependsOnBadge(tk);
    return (
      '<div class="ticket-card risk-stripe-' + tk.risk + '" data-id="' + escapeHtml(tk.id) + '" draggable="true" tabindex="0">' +
      '<div class="ticket-id mono">' + tk.id + "</div>" +
      '<div class="ticket-title">' + escapeHtml(tk.title) + "</div>" +
      '<div class="ticket-badges">' + badges + "</div>" +
      '<div class="ticket-meta-row"><span>' + escapeHtml(tk.owner) + "</span></div>" +
      "</div>"
    );
  }

  function laneHtml(stage) {
    var items = ticketsByStage(stage.id);
    var cap = WIP_CAPS[stage.id];
    var over = cap && items.length > cap;
    var gauge = cap ? items.length + " / " + cap : String(items.length);
    var body = items.length ? items.map(cardHtml).join("") : '<div class="lane-empty">— 沒有卡片 —</div>';
    return (
      '<div class="lane" data-stage="' + stage.id + '" style="border-top: 3px solid ' + stage.color + '">' +
      '<div class="lane-head">' +
      '<div class="lane-title-row"><span class="lane-title">' + stage.label + "</span>" +
      '<span class="lane-gauge tabular' + (over ? " is-over" : "") + '">' + gauge + "</span>" +
      "</div></div>" +
      '<div class="lane-body" data-lane-body="' + stage.id + '">' + body +
      '<button type="button" class="lane-add-btn" data-add-to="' + stage.id + '">+ 新增卡片</button>' +
      "</div></div>"
    );
  }

  function renderLanes() {
    document.getElementById("lanes").innerHTML = STAGES.map(laneHtml).join("");
  }

  /* ── render: roadmap ── */
  function edgePath(from, to) {
    var x1 = from.x + from.width;
    var y1 = from.y + from.height / 2;
    var x2 = to.x;
    var y2 = to.y + to.height / 2;
    var bend = x1 + (x2 - x1) / 2;
    return "M" + x1 + " " + y1 + " C" + bend + " " + y1 + " " + bend + " " + y2 + " " + x2 + " " + y2;
  }

  function treeNodeHtml(node) {
    var style = "left:" + node.x + "px;top:" + node.y + "px";
    if (node.type === "root") {
      return '<button type="button" class="tree-node tree-node-root" style="' + style + '" data-collapse-epic aria-expanded="' + (!node.collapsed) + '">' +
        '<span class="node-label">EPIC</span><span class="node-name" title="' + escapeHtml(node.tree.name) + '">' + escapeHtml(node.tree.name) + "</span>" +
        '<div class="progress-bar"><span style="width:' + node.tree.progress.percent + '%"></span></div>' +
        '<span class="node-status tabular"><span>' + node.tree.progress.done + " / " + node.tree.progress.total + " 完成 · " + node.tree.progress.percent + '%</span><span class="node-collapse">' + (node.collapsed ? "展開 ＋" : "收合 −") + "</span></span></button>";
    }
    if (node.type === "story") {
      return '<button type="button" class="tree-node tree-node-story' + (node.story.unclassified ? " is-unclassified" : "") + '" style="' + style + '" data-collapse-story="' + escapeHtml(node.story.name) + '" aria-expanded="' + (!node.collapsed) + '">' +
        '<span class="node-label">USER STORY' + (node.story.unclassified ? " · 未分類" : "") + '</span><span class="node-name" title="' + escapeHtml(node.story.name) + '">' + escapeHtml(node.story.name) + "</span>" +
        '<div class="progress-bar"><span style="width:' + node.story.progress.percent + '%"></span></div>' +
        '<span class="node-status tabular"><span>' + node.story.progress.done + " / " + node.story.progress.total + " 完成</span><span class=\"node-collapse\">" + (node.collapsed ? "展開 ＋" : "收合 −") + "</span></span></button>";
    }
    var tk = node.task;
    var stage = STAGES[stageIndex(tk.stage)] || { label: tk.stage || "未設定" };
    return '<button type="button" class="tree-node tree-node-task' + (tk.stage === "done" ? " is-done" : "") + '" style="' + style + '" data-open="' + escapeHtml(tk.id) + '">' +
      '<span class="node-label mono">' + escapeHtml(tk.id) + " · " + escapeHtml(stage.label) + " · " + escapeHtml(riskLabel(tk.risk)) + '</span><span class="node-name" title="' + escapeHtml(tk.title) + '">' + escapeHtml(tk.title) + "</span></button>";
  }

  function stateHtml(kind) {
    if (kind === "loading") return '<div class="roadmap-skeleton" aria-label="正在載入藍圖…"><span class="skeleton"></span><span class="skeleton"></span><span class="skeleton"></span></div>';
    if (kind === "error") return '<div class="roadmap-state"><div class="roadmap-state-card"><h2>無法更新藍圖，請重試</h2><p>' + escapeHtml((roadmapError && roadmapError.message) || "資料暫時無法讀取；現有看板不受影響。") + '</p><button type="button" class="state-action" data-retry-roadmap>重新載入</button></div></div>';
    return '<div class="roadmap-state"><div class="roadmap-state-card"><h2>尚無藍圖資料</h2><p>先在 <span class="mono">epics.json</span> 建立 Epic 與 User Story，再從看板加入任務。</p></div></div>';
  }

  function epicNavHtml(summary) {
    var active = summary.name === KANBAN_UI_STATE.selectedEpicName;
    return '<button type="button" class="epic-nav-item' + (active ? " is-active" : "") + '" data-select-epic="' + escapeHtml(summary.name) + '" aria-current="' + (active ? "true" : "false") + '"><span class="epic-nav-name">' + escapeHtml(summary.name) + '</span><span class="epic-nav-progress tabular">' + summary.progress.done + " / " + summary.progress.total + " 完成 · " + summary.progress.percent + "%</span></button>";
  }

  function viewportTransform(viewport) {
    return "translate(" + viewport.x + "px," + viewport.y + "px) scale(" + viewport.scale + ")";
  }

  function applyViewport(announce) {
    var stage = document.querySelector(".tree-stage");
    if (!stage) return;
    stage.style.transform = viewportTransform(KANBAN_UI_STATE.viewport);
    var zoomOut = document.querySelector("[data-zoom-out]");
    var zoomIn = document.querySelector("[data-zoom-in]");
    if (zoomOut) zoomOut.disabled = KANBAN_UI_STATE.viewport.scale <= 0.25;
    if (zoomIn) zoomIn.disabled = KANBAN_UI_STATE.viewport.scale >= 1.6;
    if (announce) {
      var status = document.querySelector(".viewport-status");
      if (status) status.textContent = "畫布縮放 " + Math.round(KANBAN_UI_STATE.viewport.scale * 100) + "%";
    }
  }

  function fitRoadmap(announce) {
    var canvas = document.querySelector(".roadmap-canvas");
    if (!canvas || !activeLayout) return;
    KANBAN_UI_STATE.viewport = fitViewport(activeLayout.width, activeLayout.height, canvas.clientWidth, canvas.clientHeight, 32);
    applyViewport(announce);
  }

  function zoomRoadmap(nextScale, clientX, clientY, announce) {
    var canvas = document.querySelector(".roadmap-canvas");
    if (!canvas) return;
    var previous = KANBAN_UI_STATE.viewport;
    var scale = clampZoom(nextScale);
    if (scale === previous.scale) return;
    var rect = canvas.getBoundingClientRect();
    var pointX = Number.isFinite(clientX) ? clientX - rect.left : canvas.clientWidth / 2;
    var pointY = Number.isFinite(clientY) ? clientY - rect.top : canvas.clientHeight / 2;
    KANBAN_UI_STATE.viewport = {
      scale: scale,
      x: pointX - ((pointX - previous.x) / previous.scale) * scale,
      y: pointY - ((pointY - previous.y) / previous.scale) * scale
    };
    applyViewport(announce);
  }

  function renderRoadmap() {
    var forcedState = roadmapPreviewState;
    if (forcedState === "loading" || (roadmapStatus === "loading" && !forcedState)) {
      document.getElementById("roadmap").innerHTML = stateHtml("loading");
      return;
    }
    if (forcedState === "error" || (roadmapStatus === "error" && !EPICS.length)) {
      document.getElementById("roadmap").innerHTML = stateHtml("error");
      return;
    }
    if (forcedState === "empty" || !EPICS.length) {
      document.getElementById("roadmap").innerHTML = stateHtml("empty");
      return;
    }
    var summaries = buildEpicProgress(EPICS, TICKETS);
    KANBAN_UI_STATE.selectedEpicName = resolveSelectedEpicName(EPICS, KANBAN_UI_STATE.selectedEpicName);
    var tree = buildSelectedEpicTree(EPICS, TICKETS, KANBAN_UI_STATE.selectedEpicName);
    var layout = buildFocusedTreeLayout(tree, KANBAN_UI_STATE.collapsedBranches);
    activeLayout = layout;
    var nodeMap = {};
    layout.nodes.forEach(function (node) { nodeMap[node.id] = node; });
    var paths = layout.edges.map(function (edge) { return '<path class="tree-edge" d="' + edgePath(nodeMap[edge.from], nodeMap[edge.to]) + '"></path>'; }).join("");
    var statusError = roadmapStatus === "error";
    var readOnly = forcedState === "readonly";
    var statusText = readOnly ? "唯讀檢視" : statusError ? "更新失敗，顯示上次資料" : "資料已載入";
    document.getElementById("roadmap").innerHTML =
      '<div class="roadmap-shell"><aside class="epic-nav" aria-label="Epic 總覽"><h1 class="epic-nav-title">Epic 總覽</h1><div class="epic-nav-list">' + summaries.map(epicNavHtml).join("") + "</div></aside>" +
      '<section class="roadmap-main"><header class="roadmap-head"><div><h2>' + escapeHtml(tree.name) + '</h2><p>' + escapeHtml(tree.definition || "聚焦一個 Epic，展開它的 User Story 與 Task。") + '</p></div><span class="roadmap-mode' + (statusError ? " is-error" : "") + '">' + statusText + "</span></header>" +
      '<div class="roadmap-canvas" tabindex="0" aria-label="心智圖畫布；可用方向鍵平移，加減鍵縮放，0 回到全景"><div class="tree-toolbar" aria-label="畫布工具"><button type="button" data-zoom-out aria-label="縮小" aria-keyshortcuts="-">−</button><button type="button" data-zoom-in aria-label="放大" aria-keyshortcuts="+">＋</button><button type="button" data-fit-view aria-label="回到全景" aria-keyshortcuts="0">▣</button></div><span class="viewport-status" aria-live="polite"></span>' +
      '<div class="tree-stage" style="width:' + layout.width + "px;height:" + layout.height + "px;transform:" + viewportTransform(KANBAN_UI_STATE.viewport) + '"><svg class="tree-svg" width="' + layout.width + '" height="' + layout.height + '" aria-hidden="true">' + paths + "</svg>" + layout.nodes.map(treeNodeHtml).join("") + "</div></div></section></div>";
    applyViewport(false);
  }

  function renderAll() { renderLanes(); renderRoadmap(); }

  function isModalDirty() { return modalDirtyFields.size > 0; }

  function renderSynchronizedData() {
    renderAll();
    if (!openId) return;
    if (isModalDirty()) {
      pendingModalRefresh = true;
      return;
    }
    if (getTicket(openId)) openModal(openId);
    else closeModal();
  }

  function setSyncState(state) {
    var labels = { connecting: "正在連線", live: "即時同步", reconnecting: "重新連線中", error: "同步連線失敗" };
    KANBAN_UI_STATE.syncState = state;
    var status = document.getElementById("sync-status");
    status.dataset.state = state;
    status.textContent = labels[state] || state;
  }

  function queueResourceReload(resources, delay) {
    pendingChangeResources = mergeChangeResources(pendingChangeResources, resources);
    clearTimeout(changeReloadTimer);
    changeReloadTimer = setTimeout(function () {
      var requested = pendingChangeResources;
      pendingChangeResources = [];
      loadResources(requested);
    }, typeof delay === "number" ? delay : 120);
  }

  function startRealtimeSync() {
    if (!("EventSource" in window)) {
      setSyncState("error");
      return;
    }
    setSyncState("connecting");
    eventSource = new EventSource("/api/events");
    eventSource.addEventListener("ready", function () {
      hasBeenLive = true;
      setSyncState("live");
      queueResourceReload(["cards", "epics"], 0);
    });
    eventSource.addEventListener("change", function (event) {
      var resources = parseChangeResources(event.data);
      if (resources.length) queueResourceReload(resources);
    });
    eventSource.onerror = function () {
      setSyncState(hasBeenLive ? "reconnecting" : "error");
    };
  }

  function switchView(v) {
    currentView = v;
    document.querySelectorAll(".view").forEach(function (el) { el.classList.remove("is-active"); });
    document.getElementById("view-" + v).classList.add("is-active");
    document.querySelectorAll(".view-tabs button").forEach(function (b) {
      b.classList.toggle("is-active", b.dataset.view === v);
      b.setAttribute("aria-selected", b.dataset.view === v ? "true" : "false");
    });
    if (v === "roadmap") requestAnimationFrame(function () { fitRoadmap(false); });
  }

      '<div class="meta-item"><span class="meta-label">Agent</span><span class="meta-value">' + (escapeHtml(tk.agent) || "—") + "</span></div>" +

      '<div class="modal-body">' +
      '<div><span class="modal-section-label">描述</span><textarea class="content-input" id="field-content" placeholder="補充說明…">' + escapeHtml(tk.content) + "</textarea></div>" +
      '<div><span class="modal-section-label">相關檔案</span>' + refs + "</div>" +
      '<div><span class="modal-section-label">留言</span>' + commentsHtml +
      '<div class="comment-form"><textarea id="new-comment" placeholder="留個言…"></textarea><button type="button" id="add-comment">送出</button></div></div>' +
      "</div>" +
      '<div class="modal-footer"><button type="button" class="danger-btn" id="delete-card">刪除卡片</button><span></span></div>';

    var overlay = document.getElementById("modal-overlay");
    overlay.hidden = false;
    modalDirtyFields.clear();
    pendingModalRefresh = false;
    requestAnimationFrame(function () { overlay.classList.add("is-open"); });
  }

  function closeModal() {
    var overlay = document.getElementById("modal-overlay");
    overlay.classList.remove("is-open");
    modalDirtyFields.clear();
    pendingModalRefresh = false;
    setTimeout(function () { overlay.hidden = true; openId = null; }, 150);
  }

  function persistField(tk, fieldId) {
    saveOne(tk).then(function (saved) {
      if (saved && saved.id) TICKETS = TICKETS.map(function (item) { return item.id === saved.id ? saved : item; });
      modalDirtyFields.delete(fieldId);
      if (pendingModalRefresh) queueResourceReload(["cards"], 0);
      else renderAll();
    }).catch(function () {
      modalDirtyFields.delete(fieldId);
      pendingModalRefresh = false;
      loadResources(["cards"]);
    });
  }

  function showToast(msg, isError) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.toggle("is-error", !!isError);
    el.classList.add("is-shown");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { el.classList.remove("is-shown"); }, 2600);
  }

  /* ── drag and drop ── */
  var dragId = null;

  function getDragAfterElement(container, y) {
    var els = Array.prototype.slice.call(container.querySelectorAll(".ticket-card:not(.is-dragging)"));
    var closest = { offset: -Infinity, element: null };
    els.forEach(function (child) {
      var box = child.getBoundingClientRect();
      var offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) closest = { offset: offset, element: child };
    });
    return closest.element;
  }

  function commitDrop() {
    var changed = [];
    document.querySelectorAll(".lane").forEach(function (lane) {
      var stageId = lane.dataset.stage;
      var ids = Array.prototype.map.call(lane.querySelectorAll(".ticket-card"), function (el) { return el.dataset.id; });
      ids.forEach(function (id, i) {
        var tk = getTicket(id);
        if (!tk) return;
        var newOrder = i + 1;
        if (tk.stage !== stageId || tk.order !== newOrder) {
          tk.stage = stageId;
          tk.order = newOrder;
          changed.push(tk);
        }
      });
    });
    if (changed.length) {
      saveBulk(changed).catch(function () { loadAll().then(renderAll); });
    }
  }

  /* ── events ── */
  document.addEventListener("dragstart", function (e) {
    var card = e.target.closest(".ticket-card");
    if (!card) return;
    dragId = card.dataset.id;
    setTimeout(function () { card.classList.add("is-dragging"); }, 0);
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", dragId);
  });

  document.addEventListener("dragend", function (e) {
    var card = e.target.closest(".ticket-card");
    if (card) card.classList.remove("is-dragging");
    document.querySelectorAll(".lane.is-drag-over").forEach(function (l) { l.classList.remove("is-drag-over"); });
  });

  document.addEventListener("dragover", function (e) {
    var lane = e.target.closest(".lane");
    if (!lane || !dragId) return;
    e.preventDefault();
    document.querySelectorAll(".lane.is-drag-over").forEach(function (l) { if (l !== lane) l.classList.remove("is-drag-over"); });
    lane.classList.add("is-drag-over");
    var laneBody = lane.querySelector(".lane-body");
    var dragging = laneBody.querySelector(".is-dragging") || document.querySelector('.ticket-card[data-id="' + dragId + '"]');
    if (!dragging) return;
    var afterEl = getDragAfterElement(laneBody, e.clientY);
    var addBtn = laneBody.querySelector(".lane-add-btn");
    if (afterEl == null) laneBody.insertBefore(dragging, addBtn);
    else laneBody.insertBefore(dragging, afterEl);
  });

  document.addEventListener("drop", function (e) {
    var lane = e.target.closest(".lane");
    if (!lane) return;
    e.preventDefault();
    lane.classList.remove("is-drag-over");
    dragId = null;
    commitDrop();
  });

  document.addEventListener("click", function (e) {
    if (handleUpgradeClick(e)) return;
    if (e.target.closest(".ticket-card")) { openModal(e.target.closest(".ticket-card").dataset.id); return; }

    var taskRow = e.target.closest("[data-open]");
    if (taskRow) { openModal(taskRow.dataset.open); return; }

    var epicSelector = e.target.closest("[data-select-epic]");
    if (epicSelector) {
      KANBAN_UI_STATE.selectedEpicName = epicSelector.dataset.selectEpic;
      renderRoadmap();
      fitRoadmap(false);
      return;
    }

    var storyToggle = e.target.closest("[data-collapse-story]");
    if (storyToggle) {
      var storyName = storyToggle.dataset.collapseStory;
      var branchKey = KANBAN_UI_STATE.selectedEpicName + "::" + storyToggle.dataset.collapseStory;
      if (KANBAN_UI_STATE.collapsedBranches.has(branchKey)) KANBAN_UI_STATE.collapsedBranches.delete(branchKey);
      else KANBAN_UI_STATE.collapsedBranches.add(branchKey);
      renderRoadmap();
      fitRoadmap(false);
      var restoredStory = Array.from(document.querySelectorAll("[data-collapse-story]")).find(function (node) { return node.dataset.collapseStory === storyName; });
      if (restoredStory) restoredStory.focus();
      return;
    }

    var epicToggle = e.target.closest("[data-collapse-epic]");
    if (epicToggle) {
      var epicKey = KANBAN_UI_STATE.selectedEpicName + "::*";
      if (KANBAN_UI_STATE.collapsedBranches.has(epicKey)) KANBAN_UI_STATE.collapsedBranches.delete(epicKey);
      else KANBAN_UI_STATE.collapsedBranches.add(epicKey);
      renderRoadmap();
      fitRoadmap(false);
      var restoredEpic = document.querySelector("[data-collapse-epic]");
      if (restoredEpic) restoredEpic.focus();
      return;
    }

    if (e.target.closest("[data-zoom-out]")) { zoomRoadmap(KANBAN_UI_STATE.viewport.scale - 0.1, null, null, true); return; }
    if (e.target.closest("[data-zoom-in]")) { zoomRoadmap(KANBAN_UI_STATE.viewport.scale + 0.1, null, null, true); return; }
    if (e.target.closest("[data-fit-view]")) { fitRoadmap(true); return; }

    if (e.target.closest("[data-retry-roadmap]")) {
      roadmapPreviewState = null;
      roadmapStatus = "loading";
      roadmapError = null;
      renderRoadmap();
      loadAll().then(function () { roadmapStatus = "ready"; renderAll(); }).catch(function (err) { roadmapStatus = "error"; roadmapError = err; renderRoadmap(); });
      return;
    }

    var viewTab = e.target.closest(".view-tabs button");
    if (viewTab) { switchView(viewTab.dataset.view); return; }

    var addBtn = e.target.closest("[data-add-to]");
    if (addBtn) {
      var stageId = addBtn.dataset.addTo;
      var form = document.createElement("div");
      form.className = "lane-add-form";
      form.innerHTML = '<input type="text" placeholder="卡片標題…" autofocus><div class="row">' +
        '<button type="button" class="save">新增</button><button type="button" class="cancel">取消</button></div>';
      addBtn.replaceWith(form);
      var input = form.querySelector("input");
      input.focus();
      function submit() {
        var title = input.value.trim();
        if (!title) return;
        createCard({ title: title, stage: stageId }).then(function (card) {
          TICKETS.push(card);
          renderAll();
        });
      }
      form.querySelector(".save").addEventListener("click", submit);
      form.querySelector(".cancel").addEventListener("click", renderAll);
      input.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); if (e.key === "Escape") renderAll(); });
      return;
    }

    if (e.target === document.getElementById("modal-overlay")) { closeModal(); return; }
    if (e.target.id === "modal-close-btn") { closeModal(); return; }

    if (e.target.id === "add-comment" && openId) {
      var tk4 = getTicket(openId);
      var textarea = document.getElementById("new-comment");
      var text = textarea.value.trim();
      if (!text) return;
      var now = new Date();
      var pad = function (n) { return String(n).padStart(2, "0"); };
      var time = pad(now.getMonth() + 1) + "-" + pad(now.getDate()) + " " + pad(now.getHours()) + ":" + pad(now.getMinutes());
      tk4.comments.push({ name: COMMENT_AUTHOR, time: time, text: text });
      saveOne(tk4).then(function () { openModal(openId); });
      return;
    }

    if (e.target.id === "delete-card" && openId) {
      if (!window.confirm("確定要刪除 " + openId + " 嗎？此動作無法復原。")) return;
      var idToDelete = openId;
      deleteCard(idToDelete).then(function () {
        TICKETS = TICKETS.filter(function (x) { return x.id !== idToDelete; });
        closeModal();
        renderAll();
      });
      return;
    }
  });

  document.addEventListener("blur", function (e) {
    if (!openId) return;
    var tk = getTicket(openId);
    if (e.target.id === "field-title" && e.target.value.trim() && e.target.value !== tk.title) {
      tk.title = e.target.value.trim(); persistField(tk, "field-title");
    } else if (e.target.id === "field-content" && e.target.value !== tk.content) {
      tk.content = e.target.value; persistField(tk, "field-content");
    } else {
      modalDirtyFields.delete(e.target.id);
      if (pendingModalRefresh && !isModalDirty()) renderSynchronizedData();
    }
  }, true);

  document.addEventListener("input", function (e) {
    if (!openId) return;
    if (["field-title", "field-content", "new-comment"].includes(e.target.id)) modalDirtyFields.add(e.target.id);
  });

  document.addEventListener("keydown", function (e) {
    if (handleUpgradeKeydown(e)) return;
    if (e.key === "Escape" && !document.getElementById("modal-overlay").hidden) closeModal();
    var canvas = e.target.closest && e.target.closest(".roadmap-canvas");
    if (!canvas) return;
    var nodes = Array.from(canvas.querySelectorAll(".tree-node:is(button)"));
    var nodeIndex = nodes.indexOf(e.target);
    if (nodeIndex >= 0 && ["ArrowRight", "ArrowDown", "ArrowLeft", "ArrowUp"].includes(e.key)) {
      e.preventDefault();
      var delta = e.key === "ArrowRight" || e.key === "ArrowDown" ? 1 : -1;
      nodes[(nodeIndex + delta + nodes.length) % nodes.length].focus();
      return;
    }
    if (["+", "="].includes(e.key)) { e.preventDefault(); zoomRoadmap(KANBAN_UI_STATE.viewport.scale + 0.1, null, null, true); }
    else if (e.key === "-") { e.preventDefault(); zoomRoadmap(KANBAN_UI_STATE.viewport.scale - 0.1, null, null, true); }
    else if (e.key === "0") { e.preventDefault(); fitRoadmap(true); }
    else if (["ArrowRight", "ArrowDown", "ArrowLeft", "ArrowUp"].includes(e.key)) {
      e.preventDefault();
      var amount = e.shiftKey ? 80 : 32;
      KANBAN_UI_STATE.viewport.x += e.key === "ArrowRight" ? -amount : e.key === "ArrowLeft" ? amount : 0;
      KANBAN_UI_STATE.viewport.y += e.key === "ArrowDown" ? -amount : e.key === "ArrowUp" ? amount : 0;
      applyViewport(false);
    }
  });

  document.addEventListener("wheel", function (e) {
    var canvas = e.target.closest && e.target.closest(".roadmap-canvas");
    if (!canvas) return;
    e.preventDefault();
    canvas.classList.add("is-wheeling");
    clearTimeout(wheelIdleTimer);
    wheelIdleTimer = setTimeout(function () { canvas.classList.remove("is-wheeling"); }, 180);
    if (e.ctrlKey || e.metaKey) {
      var factor = wheelZoomFactor(e.deltaY, e.deltaMode, canvas.clientHeight);
      zoomRoadmap(KANBAN_UI_STATE.viewport.scale * factor, e.clientX, e.clientY, false);
      return;
    }
    var horizontal = e.shiftKey && !e.deltaX ? e.deltaY : e.deltaX;
    var vertical = e.shiftKey && !e.deltaX ? 0 : e.deltaY;
    KANBAN_UI_STATE.viewport.x -= wheelPanDelta(horizontal, e.deltaMode, canvas.clientWidth);
    KANBAN_UI_STATE.viewport.y -= wheelPanDelta(vertical, e.deltaMode, canvas.clientHeight);
    applyViewport(false);
  }, { passive: false });

  document.addEventListener("pointerdown", function (e) {
    var canvas = e.target.closest && e.target.closest(".roadmap-canvas");
    if (!canvas || e.target.closest("button")) return;
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (activePointers.size === 1) {
      panGesture = { pointerId: e.pointerId, startX: e.clientX, startY: e.clientY, x: KANBAN_UI_STATE.viewport.x, y: KANBAN_UI_STATE.viewport.y };
    } else if (activePointers.size === 2) {
      var points = Array.from(activePointers.values());
      pinchGesture = { distance: Math.hypot(points[1].x - points[0].x, points[1].y - points[0].y) };
      panGesture = null;
    }
    canvas.classList.add("is-panning");
    canvas.setPointerCapture(e.pointerId);
  });

  document.addEventListener("pointermove", function (e) {
    if (!activePointers.has(e.pointerId)) return;
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinchGesture && activePointers.size >= 2) {
      var points = Array.from(activePointers.values()).slice(0, 2);
      var distance = Math.hypot(points[1].x - points[0].x, points[1].y - points[0].y);
      var centerX = (points[0].x + points[1].x) / 2;
      var centerY = (points[0].y + points[1].y) / 2;
      if (pinchGesture.distance > 0) zoomRoadmap(KANBAN_UI_STATE.viewport.scale * distance / pinchGesture.distance, centerX, centerY, false);
      pinchGesture.distance = distance;
      return;
    }
    if (!panGesture || panGesture.pointerId !== e.pointerId) return;
    KANBAN_UI_STATE.viewport.x = panGesture.x + e.clientX - panGesture.startX;
    KANBAN_UI_STATE.viewport.y = panGesture.y + e.clientY - panGesture.startY;
    applyViewport(false);
  });

  function endPan(e) {
    if (!activePointers.has(e.pointerId)) return;
    activePointers.delete(e.pointerId);
    pinchGesture = null;
    if (activePointers.size === 1) {
      var remaining = Array.from(activePointers.entries())[0];
      panGesture = { pointerId: remaining[0], startX: remaining[1].x, startY: remaining[1].y, x: KANBAN_UI_STATE.viewport.x, y: KANBAN_UI_STATE.viewport.y };
      return;
    }
    var canvas = document.querySelector(".roadmap-canvas");
    if (canvas) canvas.classList.remove("is-panning");
    panGesture = null;
  }
  document.addEventListener("pointerup", endPan);
  document.addEventListener("pointercancel", endPan);

  renderRoadmap();
  loadUpgradeStatus();
  loadAll().then(function () {
    roadmapStatus = "ready";
    renderAll();
    startRealtimeSync();
  }).catch(function (err) {
    roadmapStatus = "error";
    roadmapError = err;
    renderRoadmap();
    showToast("讀取失敗：" + err.message, true);
    startRealtimeSync();
  });
})();
</script>
</body>
</html>
